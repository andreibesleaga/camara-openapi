openapi: 3.0.3
info:
  title: Device Reachability Status Subscriptions
  description: |
    This API provides the API consumer with the ability to subscribe to reachability status events.

    # Introduction

    The API consumer is able to be notified whenever the reachability status of a certain user device has changed for either data or SMS connectivity. This capability is requested via a subscription request - in this case the reachability status is not contained in the API response, but instead an event notification is sent back to the event subscriber whenever the reachability situation changes.

    # Relevant terms and definitions

    * **Reachable**:\
       A device is considered to be reachable if it has mobile data connectivity, or can receive SMS messages.

    * **Connectivity:**\
      Indicates the connectivity types (mobile data, SMS, or both) by which the device is reachable from the network. A device is considered to be disconnected if it cannot be reached using either mobile data or SMS connectivity.

    * **Device**:\
      A device refers to any physical hardware that can connect to a mobile network and participate in network communication.

      At least one identifier for the device out of four options must be provided: IPv4 address, IPv6 address, phone number, or network access identifier assigned by the mobile network operator for the device. Where more than one device identifier is provided, only one identifier will be selected by the implementation and this choice indicated to the API consumer in the session creation response.

      Note: Network Access Identifier is defined for future use and will not be supported with this version of the API.

    # API Functionality

    The API exposes following capability:

    ## Device Reachability Status Subscription

    These endpoints allow the API consumer to manage event subscriptions for device reachability status events.
    The CAMARA subscription model is described in the `CAMARA API Event Subscription and Notification Guide` and uses notifications that follow the CloudEvents specification.

    When creating a subscription, it is mandatory to provide the event types you are subscribing to, as multiple subscription-types are managed by this API.

    The following event types may be requested for this API:
      - `org.camaraproject.device-reachability-status-subscriptions.v0.reachability-data` is sent when the device becomes connected to the network for data usage (regardless of the SMS reachability status)
      - `org.camaraproject.device-reachability-status-subscriptions.v0.reachability-sms` is sent when the device becomes connected to the network for SMS usage (regardless of the data reachability status)
      - `org.camaraproject.device-reachability-status-subscriptions.v0.reachability-disconnected` is sent when the device becomes disconnected from the network

    Note: Additionally, the following events may be sent, which do not require a dedicated subscription:
      - `org.camaraproject.device-reachability-status-subscriptions.v0.subscription-started` is sent when the subscription starts.
      - `org.camaraproject.device-reachability-status-subscriptions.v0.subscription-updated` is sent when the subscription is updated.
      - `org.camaraproject.device-reachability-status-subscriptions.v0.subscription-ended` is sent when the subscription ends.

    The `subscription-ended` event may be used in following cases:
      - the subscription expire time (optionally set by the requester) has been reached
      - the maximum number of subscription events (optionally set by the requester) has been reached
      - the subscription was deleted by the API consumer
      - the expiry time for the access token `sinkCredential` (optionally set by the API consumer) time has been reached
      - the API provider has to stop sending notifications early

    **Note on combined usage of `initialEvent` and `subscriptionMaxEvents`**:

    If an initial event is triggered because `initialEvent` set to true, that event will count towards `subscriptionMaxEvents` if that has been specified.

    **Clarification on `initialEvent` setting and event type behaviour:**

    Following table illustrate behaviour regarding event triggering depending on **initial** reachability state of the device:

    | subscribed event-type      | device reachability status at subscription time  | event sent if `initialEvent` is `true` | Explanation                                   |
    | -------------------------- | ------------------------------------------------ | -------------------------------------- | --------------------------------------------- |
    | reachability-data          | Device is connected for data and possibly SMS    | Yes                                    | The device is reachable using data            |
    | reachability-data          | Device is connected for SMS only                 | No                                     | The device is not reachable using data        |
    | reachability-data          | Device is disconnected from the network          | No                                     | The device is not reachable using data        |
    | reachability-sms           | Device is connected for SMS and possibly data    | Yes                                    | The device is reachable using SMS        |
    | reachability-sms           | Device is connected for data only                | No                                     | The device is not reachable using SMS         |
    | reachability-sms           | Device is disconnected from the network          | No                                     | The device is not reachable using SMS         |
    | reachability-disconnected  | Device is disconnected from the network          | Yes                                    | The device is not reachable at all            |
    | reachability-disconnected  | Device is connected for data and/or SMS          | No                                     | The device is reachable using data and/or SMS |

    ### Notifications callback

    This endpoint describes the format of the event notification received by the API consumer when an event is sent.
    A detailed description of the event subscription and notification mechanism is provided in the `CAMARA API Event Subscription and Notification Guide`.

    _**WARNING**:\
      API consumers must provide a callback URL on which reachability status notifications from the API provider can be received. This callback endpoint must be exposed by API consumer as `POST /{$request.body#/sink}`. When an event occurs, the API provider will send the event to the URL specified by `sink`._

    <!-- CAMARA:MANDATORY:authorization-and-authentication:BEGIN -->

    # Authorization and authentication

    The "Camara Security and Interoperability Profile" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.

    The specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.

    In cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.
    <!-- CAMARA:MANDATORY:authorization-and-authentication:END -->

    <!-- CAMARA:MANDATORY:identifying-device-from-access-token:BEGIN -->

    # Identifying the device from the access token

    This API requires the API consumer to identify a device as the subject of the API as follows:
    - When the API is invoked using a two-legged access token, the subject will be identified from the optional `device` object, which therefore MUST be provided.
    - When a three-legged access token is used however, this optional identifier MUST NOT be provided, as the subject will be uniquely identified from the access token.

    This approach simplifies API usage for API consumers using a three-legged access token to invoke the API by relying on the information that is associated with the access token and was identified during the authentication process.

    ## Error handling:

    - If the subject cannot be identified from the access token and the optional `device` object is not included in the request, then the server will return an error with the `422 MISSING_IDENTIFIER` error code.

    - If the subject can be identified from the access token and the optional `device` object is also included in the request, then the server will return an error with the `422 UNNECESSARY_IDENTIFIER` error code. This will be the case even if the same device is identified by these two methods, as the server is unable to make this comparison.
    <!-- CAMARA:MANDATORY:identifying-device-from-access-token:END -->

    # Multi-SIM scenario handling

    In multi-SIM scenarios where more than one mobile device is associated with a phone number (e.g. a smartphone with an associated smartwatch), it might not be possible to uniquely identify from that phone number the device for which reachability status notifications should be provided. If the phone number is used as the device identifier when creating a subscription for a multi-SIM scenario, the API may:
    - respond with an error, or
    - provide reachability status update notifications for the multi-SIM group as a whole, or
    - provide reachability status update notifications only for a single device in the multi-SIM group, which may not be the intended device.

    Possible solutions in such a scenario include:
    - Using the authorisation code flow to obtain an access token, which will automatically identify the intended device
    - Identifying the intended device from a unique identifier for that device, such as its source IP address and port
    - Check with the SIM provider whether a unique "secondary" phone number is already associated with each device, and use the secondary phone number to identify the intended device if available.

    <!-- CAMARA:MANDATORY:additional-error-responses:BEGIN -->

    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.

    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified from the `x-camara-commonalities` field, the changelog and the metadata of the released API version.

    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.
    <!-- CAMARA:MANDATORY:additional-error-responses:END -->

    <!-- CAMARA:MANDATORY:request-body-strictness:BEGIN -->

    # Request body strictness

    This API rejects requests with JSON request bodies that contain properties not declared in this specification, at any nesting level. Unknown properties result in a `400 INVALID_ARGUMENT` response.
    <!-- CAMARA:MANDATORY:request-body-strictness:END -->
