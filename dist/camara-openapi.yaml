    TenureTenure:
      description: Specifies date from which continuous tenure of the identified mobile subscriber is required to be confirmed
      type: object
      properties:
        phoneNumber:
          description: A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
          type: string
          pattern: ^\+[1-9][0-9]{4,14}$
          maxLength: 16
          example: "+123456789"
        tenureDate:
          type: string
          description: The date, in RFC 3339 / ISO 8601 compliant format "YYYY-MM-DD", from which continuous tenure of the identified network subscriber is required to be confirmed
          format: date
          minLength: 10
          maxLength: 10
          example: "2023-07-03"
      required:
        - tenureDate
    TenureTenureInfo:
      type: object
      description: Defines tenure information provided in API response body
      properties:
        tenureDateCheck:
          description: |
            `true` when the identified mobile subscription has had valid tenure since `tenureDate`, otherwise `false`
          example: true
          type: boolean
        contractType:
          description: |
            If exists, populated with:
            - `PAYG` - prepaid (pay-as-you-go) account
            - `PAYM` - contract account
            - `Business` - Business (enterprise) account

            This attribute may be omitted from the response set if the information is not available
          example: PAYM
          type: string
          enum:
            - PAYG
            - PAYM
            - Business
      required:
        - tenureDateCheck
    NumberRecyclingCreateCheckNumRecycling:
      description: Properties to request for a number recycling check
      type: object
      required:
        - specifiedDate
      properties:
        phoneNumber:
          description: A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
          type: string
          pattern: ^\+[1-9][0-9]{4,14}$
          maxLength: 16
          example: "+123456789"
        specifiedDate:
          type: string
          format: date
          maxLength: 64
          description: Specified date to check whether there has been a change in the subscriber associated with the specific phone number, in RFC 3339 calendar date format (YYYY-MM-DD).
          example: "2024-10-31"
    NumberRecyclingCheckNumRecyclingInfo:
      description: Properties to response to a number recycling check request
      type: object
      required:
        - phoneNumberRecycled
      properties:
        phoneNumberRecycled:
          type: boolean
          description: |
            Set to true (Boolean, not string) when there has been a change in the subscriber associated with the specific phone number after “specifiedDate”.
    OTPValidationSendCodeBody:
      description: Structure to request sending a code to a phone number
      type: object
      properties:
        phoneNumber:
          $ref: "#/components/schemas/OTPValidationPhoneNumber"
        message:
          $ref: "#/components/schemas/OTPValidationMessage"
      required:
        - message
        - phoneNumber
      additionalProperties: false
    OTPValidationSendCodeResponse:
      description: Structure to provide authentication identifier
      type: object
      properties:
        authenticationId:
          $ref: "#/components/schemas/OTPValidationAuthenticationId"
      required:
        - authenticationId
    OTPValidationValidateCodeBody:
      description: Structure to request code verification
      type: object
      properties:
        authenticationId:
          $ref: "#/components/schemas/OTPValidationAuthenticationId"
        code:
          $ref: "#/components/schemas/OTPValidationCode"
      required:
        - authenticationId
        - code
      additionalProperties: false
    OTPValidationPhoneNumber:
      description: A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
      type: string
      pattern: ^\+[1-9][0-9]{4,14}$
      maxLength: 16
      example: "+123456789"
    OTPValidationMessage:
      type: string
      description: Message template used to compose the content of the SMS sent to the phone number. It must include the following label indicating where to include the short code `{{code}}`
      pattern: .*\{\{code\}\}.*
      maxLength: 160
      example: "{{code}} is your short code to authenticate with Cool App via SMS"
    OTPValidationAuthenticationId:
      type: string
      description: unique id of the verification attempt the code belongs to.
      pattern: ^[a-zA-Z0-9-]{1,36}$
      maxLength: 36
      example: ea0840f3-3663-4149-bd10-c7c6b8912105
    OTPValidationCode:
      type: string
      description: temporary, short code to be validated
      maxLength: 10
      example: AJY3
    OTPValidationErrorInfo:
      type: object
      description: A structured error response providing details about a failed request, including the HTTP status code, an error code, and a human-readable message
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP response status code
        code:
          type: string
          maxLength: 96
          description: A human-readable code to describe the error
        message:
          type: string
          maxLength: 512
          description: A human-readable description of what the event represents
    CallForwardingSignalUnconditionalCallForwardingSignal:
      description: resource containing the information about the Unconditional Call Forwarding Service for the given phone number (PhoneNumber)
      type: object
      properties:
        active:
          type: boolean
          description: Indicates if the unconditional call forwarding service is active.
    CallForwardingSignalCallForwardingSignal:
      description: resource containing the list of the Call Forwarding Services active for the given phone number (PhoneNumber). The possible states are, 'inactive' (no call forwarding service activated), 'unconditional' (call forwarded independently from the device status), 'conditional_busy' (call forwarded if the device is on an active call), 'conditional_not_reachable' (call forwarded if the device is not reachable), 'conditional_no_answer' (call forwarded if the device doesn't answer the incoming call).
      type: array
      items:
        type: string
        description: Type of call forwarding service active for the phone number.
        enum:
          - inactive
          - unconditional
          - conditional_busy
          - conditional_not_reachable
          - conditional_no_answer
      example:
        - unconditional
        - conditional_busy
        - conditional_no_answer
      minItems: 1
      maxItems: 5
    CallForwardingSignalXCorrelator:
      type: string
      description: Correlator string, UUID format recommended but any string matching the pattern can be used
      pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
      maxLength: 256
      example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
    CallForwardingSignalCreateCallForwardingSignal:
      description: resource containing the phone number (PhoneNumber) regarding which the Call Forwarding Service must be checked. To be provided/valued only in case of two-legged authentication. If provided/valued with three-legged authentication a 422-UNNECESSARY_IDENTIFIER error code is returned.
      type: object
      properties:
        phoneNumber:
          $ref: "#/components/schemas/CallForwardingSignalPhoneNumber"
    CallForwardingSignalPhoneNumber:
      description: A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
      type: string
      pattern: ^\+[1-9][0-9]{4,14}$
      maxLength: 16
      example: "+123456789"
    CallForwardingSignalErrorInfo:
      type: object
      description: A structured error response providing details about a failed request, including the HTTP status code, an error code, and a human-readable message
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP response status code
        code:
          type: string
          maxLength: 96
          description: A human-readable code to describe the error
        message:
          type: string
          maxLength: 512
          description: A human-readable description of what the event represents
    DeviceLocationSubscriptionRequest:
      description: The request for creating an event-type event subscription.
      type: object
      required:
        - sink
        - protocol
        - config
        - types
      properties:
        protocol:
          $ref: "#/components/schemas/DeviceLocationProtocol"
        sink:
          $ref: "#/components/schemas/Subscription/properties/sink"
        sinkCredential:
          $ref: "#/components/schemas/DeviceLocationSinkCredential"
        types:
          description: |
            Camara Event types which are eligible to be delivered by this subscription.
            Note: As of now we enforce to have only event type per subscription.
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/DeviceLocationSubscriptionEventType"
        config:
          $ref: "#/components/schemas/DeviceLocationConfigRequest"
      discriminator:
        propertyName: protocol
        mapping:
          HTTP: "#/components/schemas/DeviceLocationHTTPSubscriptionRequest"
    DeviceLocationProtocol:
      type: string
      enum:
        - HTTP
      description: Identifier of a delivery protocol. Only HTTP is allowed for now
      example: HTTP
    DeviceLocationConfig:
      description: |
        Implementation-specific configuration parameters needed by the subscription manager for
        acquiring events. Extends `ConfigBase` from `CAMARA_event_common.yaml` with the
        predefined, optional `initialEvent` property.
      allOf:
        - description: |
            Base schema for the `config` object: implementation-specific configuration parameters
            needed by the subscription manager for acquiring events. It defines the attributes
            common to all CAMARA subscription APIs (`subscriptionExpireTime`, `subscriptionMaxEvents`).

            API projects MUST define their own `Config` schema in their main OpenAPI file, extending
            `ConfigBase` via `allOf` to add the required, API-specific `subscriptionDetail` property.
            API projects MAY also add the predefined, optional `initialEvent` property (see sample-service-subscriptions.yaml),
            or omit it if sending a notification at subscription creation time is not relevant to the API’s event type(s).
          type: object
          properties:
            subscriptionExpireTime:
              type: string
              format: date-time
              maxLength: 64
              example: "2023-01-17T13:18:23.682Z"
              description: The subscription expiration time (in date-time format) requested by the API consumer. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
            subscriptionMaxEvents:
              type: integer
              format: int32
              description: Identifies the maximum number of event reports to be generated (>=1) requested by the API consumer - Once this number is reached, the subscription ends.
              minimum: 1
              maximum: 1000000
              example: 5
        - type: object
          properties:
            initialEvent:
              type: boolean
              description: |
                Set to `true` by API consumer if consumer wants to get an event as soon as the subscription is created and current situation reflects event request.
                Example: Consumer request area entered event. If consumer sets initialEvent to true and device is already in the geofence, an event is triggered.
                An event triggered this way counts towards `subscriptionMaxEvents`.
    DeviceLocationConfigRequest:
      description: |
        Implementation-specific configuration parameters are needed by the subscription manager for acquiring events.
        In CAMARA we have predefined attributes like `subscriptionExpireTime`, `subscriptionMaxEvents`, `initialEvent`.
        Specific event type attributes requested by the client must be defined in `subscriptionDetail`.
        Note: If a request is performed for several event types, all subscribed events will use the same `config` parameters.
      allOf:
        - $ref: "#/components/schemas/DeviceLocationConfig"
        - type: object
          required:
            - subscriptionDetail
          properties:
            subscriptionDetail:
              $ref: "#/components/schemas/DeviceLocationSubscriptionDetailRequest"
    DeviceLocationConfigResponse:
      description: |
        Implementation-specific configuration parameters are needed by the subscription manager for acquiring events.
        In CAMARA we have predefined attributes like `subscriptionExpireTime`, `subscriptionMaxEvents`, `initialEvent`.
        Specific event type attributes granted by the implementation are included in `subscriptionDetail`.
        Note: If a request is performed for several event types, all subscribed events will use the same `config` parameters.
      allOf:
        - $ref: "#/components/schemas/DeviceLocationConfig"
        - type: object
          required:
            - subscriptionDetail
          properties:
            subscriptionDetail:
              $ref: "#/components/schemas/DeviceLocationSubscriptionDetailResponse"
    DeviceLocationSubscriptionDetailRequest:
      description: The detail of the requested event subscription.
      type: object
      properties:
        device:
          $ref: "#/components/schemas/DeviceLocationDevice"
        area:
          $ref: "#/components/schemas/DeviceLocationArea"
      required:
        - area
    DeviceLocationSubscriptionDetailResponse:
      description: The detail of the event subscription granted by the implementation.
      type: object
      properties:
        device:
          $ref: "#/components/schemas/DeviceLocationDeviceResponse"
        area:
          $ref: "#/components/schemas/DeviceLocationArea"
      required:
        - area
    DeviceLocationSubscriptionEventType:
      type: string
      description: |
        area-entered - Event triggered when the device enters the given area

        area-left - Event triggered when the device leaves the given area
      enum:
        - org.camaraproject.geofencing-subscriptions.v0.area-entered
        - org.camaraproject.geofencing-subscriptions.v0.area-left
    DeviceLocationGeofencingEventType:
      type: string
      description: |
        area-entered - Event triggered when the device enters the given area

        area-left - Event triggered when the device leaves the given area

        subscription-started - Event triggered when the subscription starts.

        subscription-updated - Event triggered when the subscription is updated.

        subscription-ended - Event triggered when the subscription ends
      enum:
        - org.camaraproject.geofencing-subscriptions.v0.area-entered
        - org.camaraproject.geofencing-subscriptions.v0.area-left
        - org.camaraproject.geofencing-subscriptions.v0.subscription-started
        - org.camaraproject.geofencing-subscriptions.v0.subscription-updated
        - org.camaraproject.geofencing-subscriptions.v0.subscription-ended
    DeviceLocationSubscription:
      description: Represents a event-type subscription.
      type: object
      required:
        - sink
        - protocol
        - config
        - types
        - id
        - startsAt
      properties:
        protocol:
          $ref: "#/components/schemas/DeviceLocationProtocol"
        sink:
          description: The address to which events shall be delivered using the selected protocol.
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https:\/\/.+$
          example: https://endpoint.example.com/sink
        types:
          description: |
            Camara Event types eligible to be delivered by this subscription.
            Note: As of now we enforce to have only event type per subscription.
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/DeviceLocationSubscriptionEventType"
        config:
          $ref: "#/components/schemas/DeviceLocationConfigResponse"
        id:
          type: string
          maxLength: 256
          description: The unique identifier of the subscription in the scope of the subscription manager. When this information is contained within an event notification, this concept SHALL be referred as subscriptionId as per Commonalities Event Notification Model.
          example: "1119920371"
        startsAt:
          type: string
          format: date-time
          maxLength: 64
          description: |
            Date when the event subscription will begin/began
            It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
          example: "2023-07-03T12:27:08.312Z"
        expiresAt:
          type: string
          format: date-time
          maxLength: 64
          description: |
            Date when the event subscription will expire. Only provided when `subscriptionExpireTime` is indicated by API client or Telco Operator has specific policy about that.
            It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
          example: "2023-07-03T12:27:08.312Z"
        status:
          type: string
          description: |-
            Current status of the subscription - Management of Subscription State engine is not mandatory for now. Note not all statuses may be considered to be implemented. Details:
              - `ACTIVATION_REQUESTED`: Subscription creation (POST) is triggered but subscription creation process is not finished yet.
              - `ACTIVE`: Subscription creation process is completed. Subscription is fully operative.
              - `INACTIVE`: Subscription is temporarily inactive, but its workflow logic is not deleted.
              - `EXPIRED`: Subscription is ended (no longer active). This status applies when subscription is ended due to `SUBSCRIPTION_EXPIRED` or `ACCESS_TOKEN_EXPIRED` event.
              - `DELETED`: Subscription is ended as deleted (no longer active). This status applies when subscription information is kept (i.e. subscription workflow is no longer active but its meta-information is kept).
          enum:
            - ACTIVATION_REQUESTED
            - ACTIVE
            - EXPIRED
            - INACTIVE
            - DELETED
      discriminator:
        propertyName: protocol
        mapping:
          HTTP: "#/components/schemas/DeviceLocationHTTPSubscriptionResponse"
    DeviceLocationSubscriptionAsync:
      description: Response for an event-type subscription request managed asynchronously (Creation or Deletion).
      type: object
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/DeviceLocationSubscriptionId"
    DeviceLocationDevice:
      description: |
        End-user equipment able to connect to a mobile network. Examples of devices include smartphones or IoT sensors/actuators.
            The developer can choose to provide the below specified device identifiers:
            * `ipv4Address`
            * `ipv6Address`
            * `phoneNumber`
            * `networkAccessIdentifier`
            NOTE1: the network operator might support only a subset of these options. The API Consumer can provide multiple identifiers to ensure compatibility across different network operators. In this case, the API Provider will use one of the identifiers for the API logic without performing any matching checks among the provided identifiers.
            NOTE2: as for this Commonalities release, we are enforcing that the networkAccessIdentifier is only part of the schema for future-proofing, and CAMARA does not currently allow its use. After the CAMARA meta-release work is concluded and the relevant issues are resolved, its use will need to be explicitly documented in the guidelines.
      type: object
      properties:
        phoneNumber:
          description: A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
          type: string
          pattern: ^\+[1-9][0-9]{4,14}$
          maxLength: 16
          example: "+123456789"
        networkAccessIdentifier:
          description: A public identifier addressing a subscription in a mobile network. In 3GPP terminology, it corresponds to the GPSI formatted with the External Identifier ({Local Identifier}@{Domain Identifier}). Unlike the telephone number, the network access identifier is not subjected to portability ruling in force, and is individually managed by each operator.
          type: string
          maxLength: 2048
          example: 123456789@example.com
        ipv4Address:
          type: object
          description: |
            The device should be identified by either the public (observed) IP address and port as seen by the application server, or the private (local) and any public (observed) IP addresses in use by the device (this information can be obtained by various means, for example from some DNS servers).

            If the allocated and observed IP addresses are the same (i.e. NAT is not in use) then  the same address should be specified for both publicAddress and privateAddress.

            If NAT64 is in use, the device should be identified by its publicAddress and publicPort, or separately by its allocated IPv6 address (field ipv6Address of the Device object)

            In all cases, publicAddress must be specified, along with at least one of either privateAddress or publicPort, dependent upon which is known. In general, mobile devices cannot be identified by their public IPv4 address alone.
          properties:
            publicAddress:
              description: A single IPv4 address with no subnet mask
              type: string
              format: ipv4
              maxLength: 15
              example: 84.125.93.10
            privateAddress:
              $ref: "#/components/schemas/Device/properties/ipv4Address/properties/publicAddress"
            publicPort:
              description: TCP or UDP port number
              type: integer
              format: int32
              minimum: 1
              maximum: 65535
          anyOf:
            - required:
                - publicAddress
                - privateAddress
            - required:
                - publicAddress
                - publicPort
          example:
            publicAddress: 84.125.93.10
            publicPort: 59765
        ipv6Address:
          description: |
            The device should be identified by the observed IPv6 address, or by any single IPv6 address from within the subnet allocated to the device (e.g. adding ::0 to the /64 prefix).
          allOf:
            - description: A single IPv6 address with no subnet mask
              type: string
              format: ipv6
              maxLength: 45
              example: 2001:db8:85a3:8d3:1319:8a2e:370:7344
      minProperties: 1
    DeviceLocationDeviceResponse:
      description: |
        An identifier for the end-user equipment able to connect to the network that the response refers to. This parameter is only returned when the API consumer includes the `device` parameter in their request (i.e. they are using a two-legged access token), and is relevant when more than one device identifier is specified, as only one of those device identifiers is allowed in the response.

        If the API consumer provides more than one device identifier in their request, and this schema is included in the response definition, the API provider MUST use it to return a single identifier which is the one they are using to fulfil the request, even if the identifiers do not match the same device. API provider does not perform any logic to validate/correlate that the indicated device identifiers match the same device. No error should be returned if the identifiers are otherwise valid to prevent API consumers correlating different identifiers with a given end user.
      allOf:
        - $ref: "#/components/schemas/DeviceLocationDevice"
        - maxProperties: 1
    DeviceLocationArea:
      type: object
      description: The geofencing area where the monitor is active. This area is specified by API consumers in the subscription request. The same area definition is included in event notifications without any modifications.
      properties:
        areaType:
          $ref: "#/components/schemas/DeviceLocationAreaType"
      required:
        - areaType
      discriminator:
        propertyName: areaType
        mapping:
          CIRCLE: "#/components/schemas/DeviceLocationCircle"
    DeviceLocationAreaType:
      type: string
      description: |
        Type of this area.
        CIRCLE - The area is defined as a circle.
      enum:
        - CIRCLE
    DeviceLocationCircle:
      description: Circular area
      allOf:
        - $ref: "#/components/schemas/DeviceLocationArea"
        - type: object
          properties:
            center:
              $ref: "#/components/schemas/DeviceLocationPoint"
            radius:
              type: number
              description: |
                Expected accuracy for the subscription event of device location, in meters from `center`.
                Note: The area surface could be restricted locally depending on regulations. Implementations may enforce a larger minimum radius (e.g. 1000 meters).
              minimum: 1
          required:
            - center
            - radius
      example:
        areaType: CIRCLE
        center:
          latitude: 50.735851
          longitude: 7.10066
        radius: 50000
    DeviceLocationPoint:
      type: object
      description: Coordinates (latitude, longitude) defining a location in a map
      required:
        - latitude
        - longitude
      properties:
        latitude:
          description: Latitude component of a location
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          description: Longitude component of location
          type: number
          format: double
          minimum: -180
          maximum: 180
      example:
        latitude: 50.735851
        longitude: 7.10066
    DeviceLocationGeofencingNotificationEvent:
      description: The notification callback.
      allOf:
        - type: object
          description: |
            CloudEvents 1.0 specification envelope.
            This schema is the stable base for all CAMARA event notifications.
            It imposes no constraints on `type` values or `data` structure —
            those concerns belong to the API-specific and lifecycle group schemas.
          required:
            - id
            - source
            - specversion
            - type
            - time
          properties:
            id:
              type: string
              maxLength: 256
              description: Identifier of this event, unique within the source context.
            source:
              type: string
              format: uri-reference
              minLength: 1
              maxLength: 2048
              description: |
                Identifies the context in which an event happened - be a non-empty `URI-reference` like:
                - URI with a DNS authority:
                  * https://github.com/cloudevents
                  * mailto:cncf-wg-serverless@lists.cncf.io
                - Universally-unique URN with a UUID:
                  * urn:uuid:6e8bc430-9c3a-11d9-9669-0800200c9a66
                - Application-specific identifier:
                  * /cloudevents/spec/pull/123
                  * 1-555-123-4567
              example: https://notificationSendServer12.example.com
            type:
              type: string
              maxLength: 512
              description: |
                Identifies the event type. CAMARA APIs use reverse-DNS notation:
                `org.camaraproject.<api-name>.<event-version>.<event-name>`
                The api-name segment makes each type globally unique across API groups.
            specversion:
              type: string
              description: Version of the specification to which this event conforms (must be 1.0 if it conforms to cloudevents 1.0.2 version)
              enum:
                - "1.0"
            datacontenttype:
              type: string
              description: media-type that describes the event payload encoding, must be "application/json" for CAMARA APIs
              enum:
                - application/json
            data:
              type: object
              description: Event details payload. Structure is defined by each concrete event schema.
            time:
              type: string
              format: date-time
              maxLength: 64
              description: Timestamp. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
              example: "2018-04-05T17:31:00Z"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/DeviceLocationGeofencingEventType"
      discriminator:
        propertyName: type
        mapping:
          org.camaraproject.geofencing-subscriptions.v0.area-left: "#/components/schemas/DeviceLocationEventAreaLeft"
          org.camaraproject.geofencing-subscriptions.v0.area-entered: "#/components/schemas/DeviceLocationEventAreaEntered"
          org.camaraproject.geofencing-subscriptions.v0.subscription-started: "#/components/schemas/DeviceLocationEventSubscriptionStarted"
          org.camaraproject.geofencing-subscriptions.v0.subscription-updated: "#/components/schemas/DeviceLocationEventSubscriptionUpdated"
          org.camaraproject.geofencing-subscriptions.v0.subscription-ended: "#/components/schemas/DeviceLocationEventSubscriptionEnded"
    DeviceLocationSubscriptionId:
      type: string
      maxLength: 256
      description: The unique identifier of the subscription in the scope of the subscription manager. When this information is contained within an event notification, it SHALL be referred to as `subscriptionId` as per the Commonalities Event Notification Model.
      example: qs15-h556-rt89-1298
    DeviceLocationSinkCredential:
      description: A sink credential provides authentication or authorization information necessary to enable delivery of events to a target.
      type: object
      properties:
        credentialType:
          type: string
          enum:
            - ACCESSTOKEN
            - PRIVATE_KEY_JWT
          description: |
            The type of the credential - MUST be set to ACCESSTOKEN or PRIVATE_KEY_JWT for now
      discriminator:
        propertyName: credentialType
        mapping:
          ACCESSTOKEN: "#/components/schemas/AccessTokenCredential"
          PRIVATE_KEY_JWT: "#/components/schemas/PrivateKeyJWTCredential"
      required:
        - credentialType
    DeviceLocationHTTPSettings:
      type: object
      description: HTTP protocol settings for event delivery.
      properties:
        headers:
          type: object
          description: |-
            A set of key/value pairs that is copied into the HTTP request as custom headers.

            NOTE: Use/Applicability of this concept has not been discussed in Commonalities. When required by an API project as an option to meet a UC/Requirement, please generate an issue for Commonalities discussion about it.
          additionalProperties:
            type: string
            maxLength: 512
        method:
          type: string
          description: The HTTP method to use for sending the message.
          enum:
            - POST
    DeviceLocationInitiationReason:
      type: string
      description: |
        - SUBSCRIPTION_CREATED - Subscription created by API Server
      enum:
        - SUBSCRIPTION_CREATED
    DeviceLocationUpdateReason:
      type: string
      description: |
        - SUBSCRIPTION_ACTIVE - API server transitioned subscription status to `ACTIVE`
        - SUBSCRIPTION_INACTIVE - API server transitioned subscription status to `INACTIVE`
      enum:
        - SUBSCRIPTION_ACTIVE
        - SUBSCRIPTION_INACTIVE
    DeviceLocationEventAreaLeft:
      description: Event structure for event when the device leaves the area.
      allOf:
        - $ref: "#/components/schemas/DeviceLocationGeofencingNotificationEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/DeviceLocationAreaLeft"
    DeviceLocationEventAreaEntered:
      description: Event structure for event when the device enters the area.
      allOf:
        - $ref: "#/components/schemas/DeviceLocationGeofencingNotificationEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/DeviceLocationAreaEntered"
    DeviceLocationEventSubscriptionStarted:
      description: Event structure for event subscription started
      allOf:
        - $ref: "#/components/schemas/DeviceLocationGeofencingNotificationEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/DeviceLocationSubscriptionStarted"
    DeviceLocationSubscriptionStarted:
      description: Event detail structure for subscription started event
      type: object
      required:
        - initiationReason
        - subscriptionId
        - area
      properties:
        device:
          $ref: "#/components/schemas/DeviceLocationDevice"
        area:
          $ref: "#/components/schemas/DeviceLocationArea"
        initiationReason:
          $ref: "#/components/schemas/DeviceLocationInitiationReason"
        subscriptionId:
          $ref: "#/components/schemas/DeviceLocationSubscriptionId"
        initiationDescription:
          description: Description about the start of the subscription.
          type: string
          maxLength: 512
    DeviceLocationEventSubscriptionUpdated:
      description: Event structure for event subscription updated
      allOf:
        - $ref: "#/components/schemas/DeviceLocationGeofencingNotificationEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/DeviceLocationSubscriptionUpdated"
    DeviceLocationSubscriptionUpdated:
      description: Event detail structure for subscription updated event
      type: object
      required:
        - area
        - updateReason
        - subscriptionId
      properties:
        device:
          $ref: "#/components/schemas/DeviceLocationDevice"
        area:
          $ref: "#/components/schemas/DeviceLocationArea"
        updateReason:
          $ref: "#/components/schemas/DeviceLocationUpdateReason"
        subscriptionId:
          $ref: "#/components/schemas/DeviceLocationSubscriptionId"
        updateDescription:
          description: Description about the subscription update.
          type: string
          maxLength: 512
    DeviceLocationEventSubscriptionEnded:
      description: Event structure for event subscription ends.
      allOf:
        - $ref: "#/components/schemas/DeviceLocationGeofencingNotificationEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/DeviceLocationSubscriptionEnded"
    DeviceLocationAreaLeft:
      description: |
        Event detail structure for org.camaraproject.geofencing-subscriptions.v0.area-left event.
        Note that the device object is defined as optional and will only to be returned if provided in createGeofencingSubscription.
        If more than one type of device identifier was provided, only one identifier will be returned
        (at implementation choice and with the original value provided in createGeofencingSubscription).
      type: object
      required:
        - area
        - subscriptionId
      properties:
        device:
          $ref: "#/components/schemas/DeviceLocationDeviceResponse"
        area:
          $ref: "#/components/schemas/DeviceLocationArea"
        subscriptionId:
          $ref: "#/components/schemas/DeviceLocationSubscriptionId"
    DeviceLocationAreaEntered:
      description: |
        Event detail structure for org.camaraproject.geofencing-subscriptions.v0.area-entered event.
        Note that the device object is defined as optional and will only to be returned if provided in createGeofencingSubscription.
        If more than one type of device identifier was provided, only one identifier will be returned
        (at implementation choice and with the original value provided in createGeofencingSubscription).
      type: object
      required:
        - area
        - subscriptionId
      properties:
        device:
          $ref: "#/components/schemas/DeviceLocationDeviceResponse"
        area:
          $ref: "#/components/schemas/DeviceLocationArea"
        subscriptionId:
          $ref: "#/components/schemas/DeviceLocationSubscriptionId"
    DeviceLocationSubscriptionEnded:
      description: |
        Event detail structure for org.camaraproject.geofencing-subscriptions.v0.subscription-ended event.
        Note that the device object is defined as optional and will only to be returned if provided in createGeofencingSubscription.
        If more than one type of device identifier was provided, only one identifier will be returned
        (at implementation choice and with the original value provided in createGeofencingSubscription).
      type: object
      required:
        - area
        - terminationReason
        - subscriptionId
      properties:
        device:
          $ref: "#/components/schemas/DeviceLocationDeviceResponse"
        area:
          $ref: "#/components/schemas/DeviceLocationArea"
        terminationReason:
          $ref: "#/components/schemas/DeviceLocationTerminationReason"
        terminationDescription:
          description: Explanation why a subscription ended or had to end.
          type: string
          maxLength: 512
        subscriptionId:
          $ref: "#/components/schemas/DeviceLocationSubscriptionId"
    DeviceLocationTerminationReason:
      type: string
      description: |
        - NETWORK_TERMINATED - API server stopped sending notification
        - SUBSCRIPTION_UNPROCESSABLE - Subscription cannot be processed due to some reason, e.g. because the specified area cannot be managed. Useful for asynchronous subscription creation.
        - SUBSCRIPTION_EXPIRED - Subscription expire time (optionally set by the requester) has been reached
        - SUBSCRIPTION_DELETED - Subscription was deleted by the requester
        - MAX_EVENTS_REACHED - Maximum number of events (optionally set by the requester) has been reached
        - ACCESS_TOKEN_EXPIRED - Access Token sinkCredential (optionally set by the requester with credential type `ACCESSTOKEN`) expiration time has been reached
      enum:
        - MAX_EVENTS_REACHED
        - NETWORK_TERMINATED
        - SUBSCRIPTION_UNPROCESSABLE
        - SUBSCRIPTION_EXPIRED
        - SUBSCRIPTION_DELETED
        - ACCESS_TOKEN_EXPIRED
    DeviceLocationHTTPSubscriptionRequest:
      description: Subscription request for event delivery over HTTP.
      allOf:
        - $ref: "#/components/schemas/DeviceLocationSubscriptionRequest"
        - type: object
          properties:
            protocolSettings:
              $ref: "#/components/schemas/DeviceLocationHTTPSettings"
    DeviceLocationHTTPSubscriptionResponse:
      description: Subscription response for event delivery over HTTP.
      allOf:
        - $ref: "#/components/schemas/DeviceLocationSubscription"
        - type: object
          properties:
            protocolSettings:
              $ref: "#/components/schemas/DeviceLocationHTTPSettings"
    PopulationDensityDataPopulationDensityRequest:
      type: object
      description: "Request object for retrieving population density data in a specified area. **NOTE**: The difference between `startTime` and `endTime` cannot be greater than 7 days."
      additionalProperties: false
      properties:
        area:
          $ref: "#/components/schemas/PopulationDensityDataArea"
        startTime:
          $ref: "#/components/schemas/PopulationDensityRequest/properties/endTime"
        endTime:
          type: string
          format: date-time
          maxLength: 64
          description: Timestamp. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
          example: "2018-04-05T17:31:00Z"
        precision:
          type: integer
          format: int32
          description: Precision required of response cells. Precision defines a geohash level and corresponds to the length of the geohash for each cell. More information at [Geohash system](https://en.wikipedia.org/wiki/Geohash). When `area.areaType` is `POLYGON`, if not included the default precision level 7 is used. Values within the schema range (1–12) that are not supported by the MNO return the error response `422 POPULATION_DENSITY_DATA.UNSUPPORTED_PRECISION`. Values outside the schema range are invalid per the OpenAPI definition and return `400 INVALID_ARGUMENT` via request validation. This property MUST only be set when `area.areaType` is `POLYGON`. When `area.areaType` is `GEOHASHLIST`, each requested geohash determines the granularity of its own response cell; if `precision` is sent, the API returns a `400 INVALID_ARGUMENT` error.
          minimum: 1
          maximum: 12
          default: 7
        sink:
          description: |
            The address where the API response will be asynchronously delivered, using the HTTP protocol.
            Providing `sink` enforces the asynchronous behaviour of the API. If the API provider does not
            support asynchronous processing, the request MUST be rejected with the error response
            `422 POPULATION_DENSITY_DATA.UNSUPPORTED_ASYNC_RESPONSE` and no callback is delivered.
            The API consumer can then retry the request without `sink` to obtain a synchronous response.
          allOf:
            - description: The address to which events shall be delivered using the selected protocol.
              type: string
              format: uri
              maxLength: 2048
              pattern: ^https:\/\/.+$
              example: https://endpoint.example.com/sink
        sinkCredential:
          description: A sink credential provides authentication or authorization information necessary to enable delivery of events to a target.
          type: object
          properties:
            credentialType:
              type: string
              enum:
                - ACCESSTOKEN
                - PRIVATE_KEY_JWT
              description: |
                The type of the credential - MUST be set to ACCESSTOKEN or PRIVATE_KEY_JWT for now
          discriminator:
            propertyName: credentialType
            mapping:
              ACCESSTOKEN: "#/components/schemas/AccessTokenCredential"
              PRIVATE_KEY_JWT: "#/components/schemas/PrivateKeyJWTCredential"
          required:
            - credentialType
      required:
        - area
        - startTime
        - endTime
    PopulationDensityDataArea:
      description: Base schema for all areas
      type: object
      properties:
        areaType:
          $ref: "#/components/schemas/PopulationDensityDataAreaType"
      required:
        - areaType
      discriminator:
        propertyName: areaType
        mapping:
          POLYGON: "#/components/schemas/PopulationDensityDataPolygon"
          GEOHASHLIST: "#/components/schemas/PopulationDensityDataGeohashList"
    PopulationDensityDataAreaType:
      type: string
      description: |
        Type of this area.
        POLYGON - The area is defined as a polygon.
        GEOHASHLIST - The area is defined as a list of geohashes.
      enum:
        - POLYGON
        - GEOHASHLIST
    PopulationDensityDataPolygon:
      description: Polygonal area. The Polygon should be a simple polygon, i.e. should not intersect itself.
      allOf:
        - $ref: "#/components/schemas/PopulationDensityDataArea"
        - type: object
          required:
            - boundary
          properties:
            boundary:
              description: List of points defining a polygon
              type: array
              items:
                type: object
                description: Coordinates (latitude, longitude) defining a location in a map
                required:
                  - latitude
                  - longitude
                properties:
                  latitude:
                    description: Latitude component of a location
                    type: number
                    format: double
                    minimum: -90
                    maximum: 90
                  longitude:
                    description: Longitude component of location
                    type: number
                    format: double
                    minimum: -180
                    maximum: 180
                example:
                  latitude: 50.735851
                  longitude: 7.10066
              minItems: 3
              maxItems: 15
    PopulationDensityDataGeohashList:
      description: Area defined as a list of geohashes. Geohashes do not need to be adjacent or contiguous and may have different precision levels (string lengths), as long as the MNO supports all of them. The `precision` request property MUST NOT be set when `areaType` is `GEOHASHLIST`; if set, the API returns a `400 INVALID_ARGUMENT` error.
      allOf:
        - $ref: "#/components/schemas/PopulationDensityDataArea"
        - type: object
          required:
            - geohashes
          properties:
            geohashes:
              type: array
              description: List of geohashes that define the area of interest.
              minItems: 1
              maxItems: 1000
              items:
                $ref: "#/components/schemas/PopulationDensityDataGeohash"
    PopulationDensityDataGeohash:
      type: string
      description: Geohash string identifying a cell using the [Geohash system](https://en.wikipedia.org/wiki/Geohash), encoding a geographic location into a short string. Characters are taken from the base-32 geohash alphabet (`0-9` and `b-z` excluding `a`, `i`, `l`, `o`). The length of the string determines the cell granularity (precision).
      pattern: ^[0-9bcdefghjkmnpqrstuvwxyz]{1,12}$
      maxLength: 12
      example: ezdmemd
    PopulationDensityDataPopulationDensityResponse:
      type: object
      description: Population density values is represented in time intervals for different cells of the requested area. Each element in `timedPopulationDensityData` array corresponds to a time interval, containing population density data for the grid cells. The intervals are 1 hour long.
      properties:
        timedPopulationDensityData:
          type: array
          description: |-
            Time ranges along with the population density data for the cells within it.
             The request startTime or the request endTime have to be fully covered by the intervals.
             For example, if the intervals are 1-hour long and the input date range were [2024-01-03T11:25:00Z
             to 2024-01-03T12:45:00Z] it would contain 2 intervals (Interval from 2024-01-03T11:00:00Z
             to 2024-01-03T12:00:00Z and interval from 2024-01-03T12:00:00Z to 2024-01-03T13:00:00Z).
          items:
            $ref: "#/components/schemas/PopulationDensityDataTimedPopulationDensityData"
          maxItems: 168
        status:
          $ref: "#/components/schemas/PopulationDensityDataResponseStatus"
        statusInfo:
          type: string
          maxLength: 512
          description: Information about the status, mandatory when property `status` is `OPERATION_NOT_COMPLETED` for adding extra information about the error.
          example: Some error happened during the processing of the request
      required:
        - timedPopulationDensityData
        - status
    PopulationDensityDataAcceptedAsyncResponse:
      type: object
      description: Accepted asynchronous response
      properties:
        operationId:
          $ref: "#/components/schemas/PopulationDensityDataOperationId"
      required:
        - operationId
    PopulationDensityDataPopulationDensityAsyncResponse:
      description: Asynchronous population density data response
      allOf:
        - $ref: "#/components/schemas/PopulationDensityDataPopulationDensityResponse"
        - type: object
          properties:
            operationId:
              $ref: "#/components/schemas/PopulationDensityDataOperationId"
          required:
            - operationId
    PopulationDensityDataOperationId:
      type: string
      maxLength: 256
      description: The unique identifier of the asynchronous operation that is returned when the operation is initiated.
      pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{1,256}$
      example: 2322f362-eaab-4cf3-86d2-efcbdf3a7cb4
    PopulationDensityDataResponseStatus:
      type: string
      description: |-
        Represents the state of the response for the input area defined in the request, the possible values are:
          - `SUPPORTED_AREA`: The whole request area is supported. Population density data for the entire requested area is returned.
          - `PART_OF_AREA_NOT_SUPPORTED`: Part of the requested area is outside the MNOs coverage area, the cells outside the coverage
          area will have property `dataType` with value `NO_DATA`.
          - `AREA_NOT_SUPPORTED`: The whole requested area is outside the MNOs coverage area. No data will be returned.
          - `OPERATION_NOT_COMPLETED`: An error happened during asynchronous processing of the request. This status will only be returned
          in case the asynchronous API behaviour is used.
      enum:
        - SUPPORTED_AREA
        - PART_OF_AREA_NOT_SUPPORTED
        - AREA_NOT_SUPPORTED
        - OPERATION_NOT_COMPLETED
    PopulationDensityDataTimedPopulationDensityData:
      type: object
      description: Population density data for a concrete time interval. It contains the start and end time of the interval and the population density data of each grid cell of the requested area within it.
      properties:
        startTime:
          description: Interval start time.
          allOf:
            - $ref: "#/components/schemas/PopulationDensityRequest/properties/endTime"
            - example: "2023-07-03T10:00:00Z"
        endTime:
          description: Interval end time.
          allOf:
            - $ref: "#/components/schemas/PopulationDensityRequest/properties/endTime"
            - example: "2023-07-03T11:00:00Z"
        cellPopulationDensityData:
          $ref: "#/components/schemas/PopulationDensityDataCellPopulationDensityDataArray"
      required:
        - startTime
        - endTime
        - cellPopulationDensityData
    PopulationDensityDataCellPopulationDensityDataArray:
      type: array
      description: Population density data for the different cells in a concrete time range.
      items:
        $ref: "#/components/schemas/PopulationDensityDataCellPopulationDensityData"
      minItems: 1
      maxItems: 10000
    PopulationDensityDataCellPopulationDensityData:
      type: object
      description: Population density data of a cell in a concrete time range. In case of insufficient data, to guarantee an anonymized prediction due to the k-anonymity within a specific cell and time range, no population density data is returned and the property `dataType` value is "LOW_DENSITY". In case of a cell not supported `dataType` value is "NO_DATA"
      properties:
        geohash:
          $ref: "#/components/schemas/PopulationDensityDataGeohash"
        dataType:
          type: string
          description: |
            Type of population density data returned for the cell, the possible values are:
              - `DENSITY_ESTIMATION`: The population density estimation is returned for the cell.
              - `LOW_DENSITY`: The data related to the cell is not sufficient to guarantee k-anonymity, so no population density estimation is returned.
              - `NO_DATA`: The cell is outside the MNO coverage area, so no population density data is returned.
          enum:
            - NO_DATA
            - LOW_DENSITY
            - DENSITY_ESTIMATION
      required:
        - geohash
        - dataType
      discriminator:
        propertyName: dataType
        mapping:
          NO_DATA: "#/components/schemas/PopulationDensityDataNoData"
          LOW_DENSITY: "#/components/schemas/PopulationDensityDataLowDensity"
          DENSITY_ESTIMATION: "#/components/schemas/PopulationDensityDataDensityEstimation"
    PopulationDensityDataNoData:
      description: Cell outside the MNO coverage area. No population density data is returned for it.
      allOf:
        - $ref: "#/components/schemas/PopulationDensityDataCellPopulationDensityData"
    PopulationDensityDataLowDensity:
      description: Cell whose data is not sufficient to guarantee k-anonymity in the time interval. No population density data is returned for it.
      allOf:
        - $ref: "#/components/schemas/PopulationDensityDataCellPopulationDensityData"
    PopulationDensityDataDensityEstimation:
      description: Cell with a population density estimation, expressed in people/km2, together with the estimation range [minimum, maximum].
      allOf:
        - $ref: "#/components/schemas/PopulationDensityDataCellPopulationDensityData"
        - type: object
          properties:
            maxPplDensity:
              type: integer
              format: int32
              minimum: 0
              maximum: 2147483647
              description: Maximum people/km2 estimated for the defined area.
            minPplDensity:
              type: integer
              format: int32
              minimum: 0
              maximum: 2147483647
              description: Minimum people/km2 estimated for the defined area.
            pplDensity:
              type: integer
              format: int32
              minimum: 0
              maximum: 2147483647
              description: people/km2 estimation for the defined area.
          required:
            - maxPplDensity
            - minPplDensity
            - pplDensity
    RegionDeviceCountXCorrelator:
      type: string
      pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
      example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
    RegionDeviceCountRegionDeviceCountRequestBody:
      type: object
      description: Payload to get the count of devices in the specific region.
      properties:
        area:
          $ref: "#/components/schemas/RegionDeviceCountArea"
        starttime:
          type: string
          format: date-time
          description: Starting timestamp for counting the number of devices in the area. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
          nullable: true
          example: "2023-07-03T14:27:08.312+02:00"
        endtime:
          type: string
          format: date-time
          description: Ending timestamp for counting the number of devices in the area. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
          nullable: true
          example: "2023-07-04T14:27:08.312+02:00"
        filter:
          $ref: "#/components/schemas/RegionDeviceCountFilter"
        sink:
          type: string
          format: uri
          description: The URL where the API response will be asynchronously delivered, using the HTTP protocol.
          example: https://endpoint.example.com/sink
        sinkCredential:
          description: A sink credential provides authentication or authorization information necessary to enable delivery of events to a target.
          allOf:
            - $ref: "#/components/schemas/RegionDeviceCountSinkCredential"
    RegionDeviceCountArea:
      type: object
      properties:
        areaType:
          $ref: "#/components/schemas/RegionDeviceCountAreaType"
      required:
        - areaType
      discriminator:
        propertyName: areaType
        mapping:
          CIRCLE: "#/components/schemas/RegionDeviceCountCircle"
          POLYGON: "#/components/schemas/RegionDeviceCountPolygon"
    RegionDeviceCountAreaType:
      type: string
      description: |
        Type of this area.
        CIRCLE - The area is defined as a circle.
        POLYGON - The area is defined as a polygon.
      enum:
        - CIRCLE
        - POLYGON
    RegionDeviceCountCircle:
      description: Circular area
      allOf:
        - $ref: "#/components/schemas/RegionDeviceCountArea"
        - type: object
          required:
            - center
            - radius
          properties:
            center:
              $ref: "#/components/schemas/RegionDeviceCountPoint"
            radius:
              type: number
              description: Distance from the center in meters
              minimum: 1
    RegionDeviceCountPolygon:
      allOf:
        - $ref: "#/components/schemas/RegionDeviceCountArea"
        - type: object
          required:
            - boundary
          properties:
            boundary:
              $ref: "#/components/schemas/RegionDeviceCountPointList"
    RegionDeviceCountPointList:
      type: array
      items:
        $ref: "#/components/schemas/RegionDeviceCountPoint"
      minItems: 3
      maxItems: 15
    RegionDeviceCountPoint:
      type: object
      description: Coordinates (latitude, longitude) defining a location in a map
      required:
        - latitude
        - longitude
      properties:
        latitude:
          $ref: "#/components/schemas/RegionDeviceCountLatitude"
        longitude:
          $ref: "#/components/schemas/RegionDeviceCountLongitude"
      example:
        latitude: 50.735851
        longitude: 7.10066
    RegionDeviceCountLatitude:
      description: Latitude component of a location
      type: number
      format: double
      minimum: -90
      maximum: 90
    RegionDeviceCountLongitude:
      description: Longitude component of location
      type: number
      format: double
      minimum: -180
      maximum: 180
    RegionDeviceCountFilter:
      description: |
        This parameter is used to filter devices. Currently, two filtering criteria are defined, `roamingStatus` and `deviceType`, which can be expanded in the future. `IN` logic is used used for multiple filtering items within a single filtering criterion, `AND` logic is used between multiple filtering criteria.
        - If a filtering critera is not provided, it means that there is no need to filter this item.
        - At least one of the criteria must be provided,a filter without any criteria is not allowed.
        - If no filtering is required, this parameter does not need to be provided.
        For example ,`"filter":{"roamingStatus": ["roaming"],"deviceType": ["human device","IoT device"]}` means the API need to return the count of human network devices and IoT devices that are in roaming mode.`"filter":{"roamingStatus": ["non-roaming"]}` means that the API need to return the count of all devices that are not in roaming mode.
      type: object
      properties:
        roamingStatus:
          description: Filter whether the device is in roaming mode,'roaming' represents the need to filter devices that are in roaming mode,'non-roaming' represents the need to filter devices that are not roaming.
          type: array
          items:
            type: string
            enum:
              - roaming
              - non-roaming
          minItems: 1
        deviceType:
          description: Filtering by device type, 'human device' represents the need to filter for human network devices, 'IoT device' represents the need to filter for IoT devices, and 'other' represents the need to filter for other types of devices.
          type: array
          items:
            type: string
            enum:
              - human device
              - IoT device
              - other
          minItems: 1
      anyOf:
        - required:
            - roamingStatus
        - required:
            - deviceType
    RegionDeviceCountSinkCredential:
      type: object
      properties:
        credentialType:
          type: string
          enum:
            - PLAIN
            - ACCESSTOKEN
            - REFRESHTOKEN
          description: |
            The type of the credential.
            Note: Type of the credential - MUST be set to ACCESSTOKEN for now
      discriminator:
        propertyName: credentialType
        mapping:
          PLAIN: "#/components/schemas/RegionDeviceCountPlainCredential"
          ACCESSTOKEN: "#/components/schemas/RegionDeviceCountAccessTokenCredential"
          REFRESHTOKEN: "#/components/schemas/RegionDeviceCountRefreshTokenCredential"
      required:
        - credentialType
    RegionDeviceCountPlainCredential:
      type: object
      description: A plain credential as a combination of an identifier and a secret.
      allOf:
        - $ref: "#/components/schemas/RegionDeviceCountSinkCredential"
        - type: object
          required:
            - identifier
            - secret
          properties:
            identifier:
              description: The identifier might be an account or username.
              type: string
            secret:
              description: The secret might be a password or passphrase.
              type: string
    RegionDeviceCountAccessTokenCredential:
      type: object
      description: An access token credential.
      allOf:
        - $ref: "#/components/schemas/RegionDeviceCountSinkCredential"
        - type: object
          properties:
            accessToken:
              description: REQUIRED. An access token is a previously acquired token granting access to the target resource.
              type: string
            accessTokenExpiresUtc:
              type: string
              format: date-time
              description: |
                REQUIRED. An absolute (UTC) timestamp at which the token shall be considered expired.
                In the case of an ACCESS_TOKEN_EXPIRED termination reason, implementation should notify the client before the expiration date.
                If the access token is a JWT and registered "exp" (Expiration Time) claim is present, the two expiry times should match.
                It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
                Recommended format is yyyy-MM-dd'T'HH:mm:ss.SSSZ (i.e. which allows 2023-07-03T14:27:08.312+02:00 or 2023-07-03T12:27:08.312Z)
              example: "2023-07-03T12:27:08.312Z"
            accessTokenType:
              description: REQUIRED. Type of the access token (See [OAuth 2.0](https://tools.ietf.org/html/rfc6749#section-7.1)). For the current version of the API the type MUST be set to `Bearer`.
              type: string
              enum:
                - bearer
          required:
            - accessToken
            - accessTokenExpiresUtc
            - accessTokenType
    RegionDeviceCountRefreshTokenCredential:
      type: object
      description: An access token credential with a refresh token.
      allOf:
        - $ref: "#/components/schemas/RegionDeviceCountSinkCredential"
        - type: object
          properties:
            accessToken:
              description: REQUIRED. An access token is a previously acquired token granting access to the target resource.
              type: string
            accessTokenExpiresUtc:
              type: string
              format: date-time
              description: |
                REQUIRED. An absolute (UTC) timestamp at which the token shall be considered expired.
                In the case of an ACCESS_TOKEN_EXPIRED termination reason, implementation should notify the client before the expiration date.
                If the access token is a JWT and registered "exp" (Expiration Time) claim is present, the two expiry times should match.
                It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
                Recommended format is yyyy-MM-dd'T'HH:mm:ss.SSSZ (i.e. which allows 2023-07-03T14:27:08.312+02:00 or 2023-07-03T12:27:08.312Z)
              example: "2023-07-03T12:27:08.312Z"
            accessTokenType:
              description: REQUIRED. Type of the access token (See [OAuth 2.0](https://tools.ietf.org/html/rfc6749#section-7.1)).
              type: string
              enum:
                - bearer
            refreshToken:
              description: REQUIRED. An refresh token credential used to acquire access tokens.
              type: string
            refreshTokenEndpoint:
              type: string
              format: uri
              description: REQUIRED. A URL at which the refresh token can be traded for an access token.
      required:
        - accessToken
        - accessTokenExpiresUtc
        - accessTokenType
        - refreshToken
        - refreshTokenEndpoint
    RegionDeviceCountRegionDeviceCountResponse:
      type: object
      description: RegionDeviceCount result
      properties:
        count:
          $ref: "#/components/schemas/RegionDeviceCountCount"
        status:
          $ref: "#/components/schemas/RegionDeviceCountStatus"
    RegionDeviceCountCount:
      description: Device Count
      type: number
    RegionDeviceCountStatus:
      description: |
        SUPPORTED_AREA: The whole requested area is supported Region Device Count for the entire requested area is returned - Telco Coverage = 100 %

        PART_OF_AREA_NOT_SUPPORTED: Part of the requested area is outside the MNOs coverage area, the area outside the coverage area are not returned - 100% >Telco Coverage >=50%

        AREA_NOT_SUPPORTED:  The whole requested area is outside the MNO coverage area No data will be returned- Telco Coverage <50%

        DENSITY_BELOW_PRIVACY_THRESHOLD:  The number of connected devices is below privacy threshold of local regulation

        TIME_INTERVAL_NO_DATA_FOUND: Unable to find device count data within the requested time interval
      type: string
      enum:
        - SUPPORTED_AREA
        - PART_OF_AREA_NOT_SUPPORTED
        - AREA_NOT_SUPPORTED
        - DENSITY_BELOW_PRIVACY_THRESHOLD
        - TIME_INTERVAL_NO_DATA_FOUND
    RegionDeviceCountErrorInfo:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          description: HTTP response status code
        code:
          type: string
          description: A human-readable code to describe the error
        message:
          type: string
          description: A human-readable description of what the event represents
    WebRTCXCorrelator:
      description: Correlator string, UUID format recommended but any string matching the pattern can be used
      type: string
      pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
      maxLength: 256
      example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
    WebRTCMediaSessionInformation:
      description: Information about a WebRTC media session including originator and receiver identities, SDP offer/answer, and call status
      type: object
      properties:
        originatorAddress:
          $ref: "#/components/schemas/WebRTCAddress"
        originatorName:
          type: string
          maxLength: 256
          description: Friendly name of the call originator
          example: Alice
        receiverAddress:
          $ref: "#/components/schemas/WebRTCAddress"
        receiverName:
          type: string
          maxLength: 256
          description: Friendly name of the call terminator
          example: Bob
        status:
          $ref: "#/components/schemas/WebRTCSessionStatus"
        offer:
          $ref: "#/components/schemas/WebRTCWrtcSdpDescriptor"
        answer:
          $ref: "#/components/schemas/WebRTCWrtcSdpDescriptor"
        callType:
          type: string
          description: Type of call. When set to EMERGENCY, the client MAY provide locationDetails. If omitted, treated as REGULAR.
          enum:
            - REGULAR
            - EMERGENCY
        locationDetails:
          description: Location of the party making this request. When provided in `POST /sessions`, it represents the originator's device location. When provided in `PUT /sessions/{mediaSessionId}/status`, it represents the location of the party making the update (either originator or answering party). Providing this information is specific to certain use cases and does not imply a guarantee of any particular server-side action or behavior.
          allOf:
            - $ref: "#/components/schemas/WebRTCLocationDetails"
    WebRTCMediaSessionCreate:
      description: Request body for creating a main session (POST request)
      allOf:
        - $ref: "#/components/schemas/WebRTCMediaSessionInformation"
        - type: object
          required:
            - originatorAddress
            - receiverAddress
            - offer
    WebRTCMediaSessionResponse:
      description: Representation of a media session resource (POST/PUT/GET response)
      type: object
      required:
        - originatorAddress
        - receiverAddress
        - status
        - offer
        - mediaSessionId
      allOf:
        - $ref: "#/components/schemas/WebRTCMediaSessionInformation"
        - type: object
          properties:
            mediaSessionId:
              type: string
              maxLength: 256
              description: The media session ID created by the network.
              example: 0AEE1B58BAEEDA3EABA42B32EBB3DFE07E9CFF402EAF9EED8EF
    WebRTCMediaSessionStatusChange:
      description: Request body for updating the status of a media session (PUT request)
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/WebRTCSessionStatus"
        offer:
          $ref: "#/components/schemas/WebRTCWrtcSdpDescriptor"
        answer:
          $ref: "#/components/schemas/WebRTCWrtcSdpDescriptor"
        locationDetails:
          $ref: "#/components/schemas/WebRTCLocationDetails"
    WebRTCWrtcSdpDescriptor:
      type: object
      description: |-
        **OFFER**: An inlined session description in SDP format [RFC4566].If XML syntax
        is used, the content of this element SHALL be embedded in a CDATA
        section.

        **ANSWER**: This type represents an answer in WebRTC Signaling. This element is not
        present in case there is no answer yet, or the session invitation has
        been declined by the Terminating Participant.This element MUST NOT be
        present in a request from the application to the server to create a
        session.
      properties:
        sdp:
          type: string
          maxLength: 65536
          description: An inlined session description in SDP format [RFC4566].If XML syntax is used, the content of this element SHALL be embedded in a CDATA section
    WebRTCSessionStatus:
      type: string
      description: Provides the status of the media session. During the session creation, this attribute SHALL NOT be included in the request.
      enum:
        - Initial
        - InProgress
        - Ringing
        - Proceeding
        - Connected
        - Terminated
        - Hold
        - Resume
        - SessionCancelled
        - Declined
        - Failed
        - Waiting
        - NoAnswer
        - NotReachable
        - Busy
      example: Ringing
    WebRTCErrorInfo:
      description: A structured error response providing details about a failed request, including the HTTP status code, an error code, and a human-readable message
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP response status code
        code:
          type: string
          maxLength: 96
          description: Friendly Code to describe the error
        message:
          type: string
          maxLength: 512
          description: A human readable description of what the event represent
    WebRTCAddress:
      type: string
      description: |-
        Subscriber address (Sender or Receiver). The following formats are supported: - A TEL URI :
          - an international format; or
          - a home local number (as defined in 3GPP TS 24.229 subclause 5.1.2A.1.5) qualified by a `phone-context`
            parameter identifying the home network numbering plan.
        - A SIP URI :
          - SIP URI with a generic user part;
          - SIP URI with a home local number (`user=phone`). The user part MAY contain a home local number qualified by
            a `phone-context` parameter, in which case the `user=phone` URI parameter SHALL be appended;
          - an emergency service URN; or
          - anonymous SIP URI

        The reserved value `sip:anonymous@anonymous.invalid` (as defined in RFC 3323) MAY be used to indicate that the calling party identity is withheld within the trust domain. When `sip:anonymous@anonymous.invalid` is set as the `originatorAddress`, the session SHALL be handled as an anonymous call origination. This value SHALL NOT be used as the `receiverAddress`.
      pattern: ^(tel:\+[1-9][0-9]{4,14}|tel:[0-9*#]{1,15};phone-context=(?:\+[1-9][0-9]{0,14}|[A-Za-z0-9](?:[A-Za-z0-9\-]*[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9\-]*[A-Za-z0-9])?)+)|sip:[A-Za-z0-9_.!%+\-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|sip:[0-9*#]{1,15};phone-context=(?:\+[1-9][0-9]{0,14}|[A-Za-z0-9](?:[A-Za-z0-9\-]*[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9\-]*[A-Za-z0-9])?)+)@[A-Za-z0-9.-]+\.[A-Za-z]{2,};user=phone|urn:service:sos(?:\.[a-z0-9](?:[a-z0-9\-]{0,30}[a-z0-9])?)*|sip:anonymous@anonymous\.invalid)$
      example: tel:+11234567899
      maxLength: 256
    WebRTCLocationDetails:
      type: object
      description: Details about a party's location and related information. This object adheres to 3GPP TS 24.229, RFC 4119, RFC 5139, and RFC 5491 for PIDF-LO compatibility. Providing this information is specific to certain use cases and does not imply a guarantee of any particular server-side action or behavior.
      properties:
        shape:
          type: string
          enum:
            - Circle
            - Ellipsoid
          description: The shape representing the caller's location (Circle or Ellipsoid).
        coordinates:
          oneOf:
            - $ref: "#/components/schemas/WebRTCCircleCoordinates"
            - $ref: "#/components/schemas/WebRTCEllipsoidCoordinates"
          description: The coordinates of the caller's location, specific to the chosen shape.
        method:
          type: string
          enum:
            - GPS
            - DBH
            - DBH_HELO
            - Other
          description: |
            The method used to obtain the location information.
            * **GPS:** Global Positioning System (highly accurate) * **DBH:** Device-Based Hybrid * **DBH_HELO:** Device-Based Hybrid using Apple Hybridized Emergency Location * **Other:** Other methods (e.g., landmarks, IP Based etc.)
        confidence:
          type: object
          description: The confidence level of the location information.
          properties:
            pdf:
              type: string
              enum:
                - normal
                - uniform
              description: The probability density function (PDF) associated with the confidence value.
            value:
              type: number
              minimum: 0
              maximum: 100
              description: The confidence value (percentage).
        timestamp:
          type: string
          format: date-time
          maxLength: 64
          description: |-
            The timestamp indicating when the location information was calculated.
            This is crucial for emergency services to assess the timeliness of the data.
            If not provided, current timestamp will be used by default.
            It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
    WebRTCCircleCoordinates:
      description: Geographic coordinates defining a circular area by center point and radius
      type: object
      required:
        - latitude
        - longitude
        - radius
      properties:
        latitude:
          type: number
          format: float
          description: Latitude of the center point in decimal degrees (WGS84).
        longitude:
          type: number
          format: float
          description: Longitude of the center point in decimal degrees (WGS84).
        radius:
          type: number
          format: float
          description: Radius of the circle in meters, indicating the uncertainty.
    WebRTCEllipsoidCoordinates:
      description: Geographic coordinates defining an ellipsoidal uncertainty area in the WGS84 geocentric coordinate system
      type: object
      required:
        - latitude
        - longitude
        - zAxis
        - semiMajorAxis
        - semiMinorAxis
        - verticalAxis
        - orientation
      properties:
        latitude:
          type: number
          format: float
          description: Latitude in the WGS 84 geocentric coordinate system.
        longitude:
          type: number
          format: float
          description: Longitude in the WGS 84 geocentric coordinate system.
        zAxis:
          type: number
          format: float
          description: Altitude (optional) in the WGS 84 geocentric coordinate system.
        semiMajorAxis:
          type: number
          description: Length of the semi-major axis of the ellipsoid in meters.
        semiMinorAxis:
          type: number
          description: Length of the semi-minor axis of the ellipsoid in meters.
        verticalAxis:
          type: number
          description: Length of the vertical axis of the ellipsoid in meters.
        orientation:
          type: number
          description: Orientation of the ellipsoid in degrees.
    ConnectivityInsightsAdditionalKpis:
      description: additional information about connectivity quality
      type: object
      properties:
        signalStrength:
          description: |
            rough indication of the end user device radio signal conditions
          type: string
          enum:
            - excellent
            - good
            - fair
            - poor
            - no signal
        connectivityType:
          description: |
            the access technology connecting the user device to the operator
            network
          type: string
          enum:
            - 5G-SA
            - 5G-NSA
            - 4G
            - 3G
    ConnectivityInsightsSubscription:
      description: Represents a event-type subscription.
      type: object
      required:
        - sink
        - protocol
        - config
        - types
        - id
        - startsAt
      properties:
        id:
          $ref: "#/components/parameters/SubscriptionId/schema"
        protocol:
          type: string
          enum:
            - HTTP
          description: Identifier of a delivery protocol. Only HTTP is allowed for now
          example: HTTP
        sink:
          description: The address to which events shall be delivered using the selected protocol.
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https:\/\/.+$
          example: https://endpoint.example.com/sink
        types:
          description: |
            Camara Event types eligible to be delivered by this subscription.
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/ConnectivityInsightsApiEventType"
        config:
          $ref: "#/components/schemas/ConnectivityInsightsConfig"
        startsAt:
          type: string
          format: date-time
          maxLength: 64
          description: Timestamp. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
          example: "2018-04-05T17:31:00Z"
        expiresAt:
          $ref: "#/components/schemas/Subscription/properties/startsAt"
        status:
          type: string
          description: |-
            Current status of the subscription - Management of Subscription
            State engine is not mandatory for now. Note not all statuses may
            be considered to be implemented. Details:
              - `ACTIVATION_REQUESTED`: Subscription creation (POST) is
              triggered but subscription creation process is not finished
              yet.
              - `ACTIVE`: Subscription creation process is completed.
              Subscription is fully operative.
              - `INACTIVE`: Subscription is temporarily inactive, but its
              workflow logic is not deleted.
              - `EXPIRED`: Subscription is ended (no longer active).
              This status applies when subscription is ended due to
              `SUBSCRIPTION_EXPIRED` or `ACCESS_TOKEN_EXPIRED` event.
              - `DELETED`: Subscription is ended as deleted (no longer
              active). This status applies when subscription information is
              kept (i.e. subscription workflow is no longer active but its
              metainformation is kept).
          enum:
            - ACTIVATION_REQUESTED
            - ACTIVE
            - EXPIRED
            - INACTIVE
            - DELETED
      discriminator:
        propertyName: protocol
        mapping:
          HTTP: "#/components/schemas/ConnectivityInsightsHTTPSubscriptionResponse"
    ConnectivityInsightsSubscriptionAsync:
      description: |
        Response for a event-type subscription request managed asynchronously
        (Creation or Deletion)
      type: object
      required:
        - id
      properties:
        id:
          $ref: "#/components/parameters/SubscriptionId/schema"
    ConnectivityInsightsPortsSpec:
      description: Specification of several TCP or UDP ports
      type: object
      minProperties: 1
      properties:
        ranges:
          description: Range of TCP or UDP ports
          type: array
          minItems: 1
          maxItems: 100
          items:
            description: A TCP or UDP port range defined by from and to ports
            type: object
            required:
              - from
              - to
            properties:
              from:
                $ref: "#/components/schemas/PortsSpec/properties/ports/items"
              to:
                $ref: "#/components/schemas/PortsSpec/properties/ports/items"
        ports:
          description: Array of TCP or UDP ports
          type: array
          minItems: 1
          maxItems: 100
          items:
            description: TCP or UDP port number
            type: integer
            format: int32
            minimum: 1
            maximum: 65535
      example:
        ranges:
          - from: 5010
            to: 5020
        ports:
          - 5060
          - 5070
    ConnectivityInsightsApplicationServer:
      description: |
        A server hosting backend applications to deliver some business logic to
        clients.

        The developer can choose to provide the below specified device
        identifiers:

        * `ipv4Address`
        * `ipv6Address`

        The Operator will use this information to calculate the end to end
        network performance in scenarios where its feasible.
      type: object
      properties:
        ipv4Address:
          $ref: "#/components/schemas/ConnectivityInsightsApplicationServerIpv4Address"
        ipv6Address:
          $ref: "#/components/schemas/ConnectivityInsightsApplicationServerIpv6Address"
      minProperties: 1
    ConnectivityInsightsApplicationServerIpv4Address:
      type: string
      maxLength: 18
      pattern: ^([01]?[0-9]?[0-9]|2[0-4][0-9]|25[0-5])(\.([01]?[0-9]?[0-9]|2[0-4][0-9]|25[0-5])){3}(\/(3[0-2]|[12]?[0-9]))?$
      example: 192.168.0.1/24
      description: |
        IPv4 address may be specified in form <address/mask> as:
          - address - an IPv4 number in dotted-quad form 1.2.3.4. Only this
          exact IP number will match the flow control rule.
          - address/mask - an IP number as above with a mask width of the
          form 1.2.3.4/24.
            In this case, all IP numbers from 1.2.3.0 to 1.2.3.255 will match.
            The bit width MUST be valid for the IP version.
    ConnectivityInsightsApplicationServerIpv6Address:
      type: string
      maxLength: 49
      pattern: ^[0-9a-fA-F:.]+(\/(12[0-8]|1[0-1][0-9]|[1-9]?[0-9]))?$
      example: 2001:db8:85a3:8d3:1319:8a2e:370:7344
      description: |
        IPv6 address may be specified in form <address/mask> as:
          - address - The /128 subnet is optional for single addresses:
            - 2001:db8:85a3:8d3:1319:8a2e:370:7344
            - 2001:db8:85a3:8d3:1319:8a2e:370:7344/128
          - address/mask - an IP v6 number with a mask:
            - 2001:db8:85a3:8d3::0/64
            - 2001:db8:85a3:8d3::/64
    ConnectivityInsightsConfig:
      description: |
        Implementation-specific configuration parameters needed by the
        subscription manager for acquiring events. Extends `ConfigBase` from
        `CAMARA_event_common.yaml` with the required, API-specific
        `subscriptionDetail` property and the optional `initialEvent` property.
        Note: if a request is performed for several event types, all subscribed
        events will use same `config` parameters.
      allOf:
        - description: |
            Base schema for the `config` object: implementation-specific configuration parameters
            needed by the subscription manager for acquiring events. It defines the attributes
            common to all CAMARA subscription APIs (`subscriptionExpireTime`, `subscriptionMaxEvents`).

            API projects MUST define their own `Config` schema in their main OpenAPI file, extending
            `ConfigBase` via `allOf` to add the required, API-specific `subscriptionDetail` property.
            API projects MAY also add the predefined, optional `initialEvent` property (see sample-service-subscriptions.yaml),
            or omit it if sending a notification at subscription creation time is not relevant to the API’s event type(s).
          type: object
          properties:
            subscriptionExpireTime:
              type: string
              format: date-time
              maxLength: 64
              example: "2023-01-17T13:18:23.682Z"
              description: The subscription expiration time (in date-time format) requested by the API consumer. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
            subscriptionMaxEvents:
              type: integer
              format: int32
              description: Identifies the maximum number of event reports to be generated (>=1) requested by the API consumer - Once this number is reached, the subscription ends.
              minimum: 1
              maximum: 1000000
              example: 5
        - type: object
          required:
            - subscriptionDetail
          properties:
            subscriptionDetail:
              $ref: "#/components/schemas/ConnectivityInsightsCreateSubscriptionDetail"
            initialEvent:
              type: boolean
              description: |
                Set to `true` by API consumer if consumer wants to get an event as soon as the subscription is created and current situation reflects event request.
                If an event is triggered following `initialEvent` set to `true`, this event will be counted towards `subscriptionMaxEvents` (if provided).
    ConnectivityInsightsSinkCredential:
      description: A sink credential provides authentication or authorization information necessary to enable delivery of events to a target.
      type: object
      properties:
        credentialType:
          type: string
          enum:
            - ACCESSTOKEN
            - PRIVATE_KEY_JWT
          description: |
            The type of the credential - MUST be set to ACCESSTOKEN or PRIVATE_KEY_JWT for now
      discriminator:
        propertyName: credentialType
        mapping:
          ACCESSTOKEN: "#/components/schemas/AccessTokenCredential"
          PRIVATE_KEY_JWT: "#/components/schemas/PrivateKeyJWTCredential"
      required:
        - credentialType
    ConnectivityInsightsCreateSubscriptionDetail:
      description: The detail of the requested event subscription
      type: object
      properties:
        device:
          description: |
            End-user equipment able to connect to a mobile network. Examples of devices include smartphones or IoT sensors/actuators.
                The developer can choose to provide the below specified device identifiers:
                * `ipv4Address`
                * `ipv6Address`
                * `phoneNumber`
                * `networkAccessIdentifier`
                NOTE1: the network operator might support only a subset of these options. The API Consumer can provide multiple identifiers to ensure compatibility across different network operators. In this case, the API Provider will use one of the identifiers for the API logic without performing any matching checks among the provided identifiers.
                NOTE2: as for this Commonalities release, we are enforcing that the networkAccessIdentifier is only part of the schema for future-proofing, and CAMARA does not currently allow its use. After the CAMARA meta-release work is concluded and the relevant issues are resolved, its use will need to be explicitly documented in the guidelines.
          type: object
          properties:
            phoneNumber:
              description: A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
              type: string
              pattern: ^\+[1-9][0-9]{4,14}$
              maxLength: 16
              example: "+123456789"
            networkAccessIdentifier:
              description: A public identifier addressing a subscription in a mobile network. In 3GPP terminology, it corresponds to the GPSI formatted with the External Identifier ({Local Identifier}@{Domain Identifier}). Unlike the telephone number, the network access identifier is not subjected to portability ruling in force, and is individually managed by each operator.
              type: string
              maxLength: 2048
              example: 123456789@example.com
            ipv4Address:
              type: object
              description: |
                The device should be identified by either the public (observed) IP address and port as seen by the application server, or the private (local) and any public (observed) IP addresses in use by the device (this information can be obtained by various means, for example from some DNS servers).

                If the allocated and observed IP addresses are the same (i.e. NAT is not in use) then  the same address should be specified for both publicAddress and privateAddress.

                If NAT64 is in use, the device should be identified by its publicAddress and publicPort, or separately by its allocated IPv6 address (field ipv6Address of the Device object)

                In all cases, publicAddress must be specified, along with at least one of either privateAddress or publicPort, dependent upon which is known. In general, mobile devices cannot be identified by their public IPv4 address alone.
              properties:
                publicAddress:
                  description: A single IPv4 address with no subnet mask
                  type: string
                  format: ipv4
                  maxLength: 15
                  example: 84.125.93.10
                privateAddress:
                  $ref: "#/components/schemas/CreateSubscriptionDetail/properties/device/properties/ipv4Address/properties/publicAddress"
                publicPort:
                  $ref: "#/components/schemas/PortsSpec/properties/ports/items"
              anyOf:
                - required:
                    - publicAddress
                    - privateAddress
                - required:
                    - publicAddress
                    - publicPort
              example:
                publicAddress: 84.125.93.10
                publicPort: 59765
            ipv6Address:
              description: |
                The device should be identified by the observed IPv6 address, or by any single IPv6 address from within the subnet allocated to the device (e.g. adding ::0 to the /64 prefix).
              allOf:
                - description: A single IPv6 address with no subnet mask
                  type: string
                  format: ipv6
                  maxLength: 45
                  example: 2001:db8:85a3:8d3:1319:8a2e:370:7344
          minProperties: 1
        applicationServer:
          $ref: "#/components/schemas/ConnectivityInsightsApplicationServer"
        applicationServerPorts:
          description: |
            A list of single ports or port ranges on the application server
          allOf:
            - $ref: "#/components/schemas/ConnectivityInsightsPortsSpec"
        applicationProfileId:
          $ref: "#/components/schemas/ConnectivityInsightsApplicationProfileId"
      required:
        - applicationServer
        - applicationProfileId
    ConnectivityInsightsSubscriptionRequest:
      description: The request for creating a event-type event subscription
      type: object
      required:
        - sink
        - protocol
        - config
        - types
      properties:
        protocol:
          $ref: "#/components/schemas/Subscription/properties/protocol"
        sink:
          $ref: "#/components/schemas/Subscription/properties/sink"
        sinkCredential:
          $ref: "#/components/schemas/ConnectivityInsightsSinkCredential"
        types:
          description: |
            Camara Event types eligible to be delivered by this subscription.
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/ConnectivityInsightsApiEventType"
        config:
          $ref: "#/components/schemas/ConnectivityInsightsConfig"
      discriminator:
        propertyName: protocol
        mapping:
          HTTP: "#/components/schemas/ConnectivityInsightsHTTPSubscriptionRequest"
    ConnectivityInsightsHTTPSubscriptionRequest:
      description: Subscription request for HTTP-based event delivery.
      allOf:
        - $ref: "#/components/schemas/ConnectivityInsightsSubscriptionRequest"
        - type: object
          properties:
            protocolSettings:
              type: object
              description: HTTP protocol settings for event delivery.
              properties:
                headers:
                  type: object
                  description: |-
                    A set of key/value pairs that is copied into the HTTP request as custom headers.

                    NOTE: Use/Applicability of this concept has not been discussed in Commonalities. When required by an API project as an option to meet a UC/Requirement, please generate an issue for Commonalities discussion about it.
                  additionalProperties:
                    type: string
                    maxLength: 512
                method:
                  type: string
                  description: The HTTP method to use for sending the message.
                  enum:
                    - POST
    ConnectivityInsightsHTTPSubscriptionResponse:
      description: Subscription resource returned for HTTP-based event delivery.
      allOf:
        - $ref: "#/components/schemas/ConnectivityInsightsSubscription"
        - type: object
          properties:
            protocolSettings:
              $ref: "#/components/schemas/HTTPSubscriptionRequest/allOf/1/properties/protocolSettings"
    ConnectivityInsightsSubscriptionList:
      description: Response with subscriptions list
      type: object
      required:
        - subscriptions
        - pagination
      properties:
        subscriptions:
          description: Subscriptions list
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: "#/components/schemas/ConnectivityInsightsSubscription"
        pagination:
          description: Pagination details helping to navigate through paged results efficiently.
          type: object
          properties:
            page:
              $ref: "#/paths/~1subscriptions/get/parameters/1/schema"
            perPage:
              $ref: "#/paths/~1subscriptions/get/parameters/2/schema"
            totalCount:
              type: integer
              format: int32
              minimum: 0
              maximum: 2147483647
              description: Total number of items matching the query, after filters applied. MAY be omitted where a full count query is prohibitively expensive.
              example: 87
            totalPages:
              type: integer
              format: int32
              minimum: 0
              maximum: 2147483647
              description: Total number of pages. Equals ceil(totalCount / perPage). MAY be omitted where totalCount is omitted.
              example: 5
    ConnectivityInsightsNetworkQualityInsight:
      type: object
      description: |
        the network's confidence level at being able to meet the network
        demands of a given application for a given terminal device.
      properties:
        applicationProfileId:
          $ref: "#/components/schemas/ConnectivityInsightsApplicationProfileId"
        packetDelayBudget:
          $ref: "#/components/schemas/ConnectivityInsightsNetworkQualityThresholdsConfidence"
        targetMinDownstreamRate:
          $ref: "#/components/schemas/ConnectivityInsightsNetworkQualityThresholdsConfidence"
        targetMinUpstreamRate:
          $ref: "#/components/schemas/ConnectivityInsightsNetworkQualityThresholdsConfidence"
        packetlossErrorRate:
          $ref: "#/components/schemas/ConnectivityInsightsNetworkQualityThresholdsConfidence"
        jitter:
          $ref: "#/components/schemas/ConnectivityInsightsNetworkQualityThresholdsConfidence"
        additionalKpis:
          $ref: "#/components/schemas/ConnectivityInsightsAdditionalKpis"
    ConnectivityInsightsNetworkQualityThresholdsConfidence:
      type: string
      description: |
        a plain-language indicator of how confident the network is to meet a
        given network demand.
      enum:
        - meets the application requirements
        - unable to meet the application requirements
    ConnectivityInsightsApplicationProfileId:
      description: Identifier for the Application Profile
      type: string
      format: uuid
      maxLength: 36
    ConnectivityInsightsApiNotificationEvent:
      description: |
        API-specific notification event group.
        Extends the CloudEvent envelope and constrains `type` to the set of
        event types defined by this API project.
        Adding a new event type only requires updating ApiEventType and the
        discriminator mapping below — the CloudEvent base never changes.
      allOf:
        - type: object
          description: |
            CloudEvents 1.0 specification envelope.
            This schema is the stable base for all CAMARA event notifications.
            It imposes no constraints on `type` values or `data` structure —
            those concerns belong to the API-specific and lifecycle group schemas.
          required:
            - id
            - source
            - specversion
            - type
            - time
          properties:
            id:
              type: string
              maxLength: 256
              description: Identifier of this event, unique within the source context.
            source:
              type: string
              format: uri-reference
              minLength: 1
              maxLength: 2048
              description: |
                Identifies the context in which an event happened - be a non-empty `URI-reference` like:
                - URI with a DNS authority:
                  * https://github.com/cloudevents
                  * mailto:cncf-wg-serverless@lists.cncf.io
                - Universally-unique URN with a UUID:
                  * urn:uuid:6e8bc430-9c3a-11d9-9669-0800200c9a66
                - Application-specific identifier:
                  * /cloudevents/spec/pull/123
                  * 1-555-123-4567
              example: https://notificationSendServer12.example.com
            type:
              type: string
              maxLength: 512
              description: |
                Identifies the event type. CAMARA APIs use reverse-DNS notation:
                `org.camaraproject.<api-name>.<event-version>.<event-name>`
                The api-name segment makes each type globally unique across API groups.
            specversion:
              type: string
              description: Version of the specification to which this event conforms (must be 1.0 if it conforms to cloudevents 1.0.2 version)
              enum:
                - "1.0"
            datacontenttype:
              type: string
              description: media-type that describes the event payload encoding, must be "application/json" for CAMARA APIs
              enum:
                - application/json
            data:
              type: object
              description: Event details payload. Structure is defined by each concrete event schema.
            time:
              $ref: "#/components/schemas/Subscription/properties/startsAt"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/ConnectivityInsightsApiEventType"
      discriminator:
        propertyName: type
        mapping:
          org.camaraproject.connectivity-insights-subscriptions.v0.network-quality: "#/components/schemas/ConnectivityInsightsEventNetworkQuality"
    ConnectivityInsightsSubscriptionLifecycleEvent:
      description: |
        Subscription lifecycle event group, common to all CAMARA APIs that
        support explicit subscriptions.
        Extends the CloudEvent envelope and constrains `type` to the set of
        lifecycle event types managed by Commonalities.
      allOf:
        - $ref: "#/components/schemas/ApiNotificationEvent/allOf/0"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/ConnectivityInsightsSubscriptionLifecycleEventType"
      discriminator:
        propertyName: type
        mapping:
          org.camaraproject.connectivity-insights-subscriptions.v0.subscription-started: "#/components/schemas/ConnectivityInsightsEventSubscriptionStarted"
          org.camaraproject.connectivity-insights-subscriptions.v0.subscription-updated: "#/components/schemas/ConnectivityInsightsEventSubscriptionUpdated"
          org.camaraproject.connectivity-insights-subscriptions.v0.subscription-ended: "#/components/schemas/ConnectivityInsightsEventSubscriptionEnded"
    ConnectivityInsightsNotificationEvent:
      description: |
        Union of all valid notification event groups at the callback endpoint.
        Its only responsibility is to enumerate which groups are valid payloads
        for this API's notification callback.
      oneOf:
        - $ref: "#/components/schemas/ConnectivityInsightsApiNotificationEvent"
        - $ref: "#/components/schemas/ConnectivityInsightsSubscriptionLifecycleEvent"
    ConnectivityInsightsEventNetworkQuality:
      description: event structure for Network Quality
      allOf:
        - $ref: "#/components/schemas/ConnectivityInsightsApiNotificationEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ConnectivityInsightsNetworkQualityInsight"
    ConnectivityInsightsEventSubscriptionStarted:
      description: event structure for event subscription started
      allOf:
        - $ref: "#/components/schemas/ConnectivityInsightsSubscriptionLifecycleEvent"
        - type: object
          properties:
            data:
              description: Event detail structure for subscription started event
              type: object
              required:
                - initiationReason
                - subscriptionId
              properties:
                initiationReason:
                  type: string
                  description: |
                    - SUBSCRIPTION_CREATED - Subscription created by API Server
                  enum:
                    - SUBSCRIPTION_CREATED
                subscriptionId:
                  $ref: "#/components/parameters/SubscriptionId/schema"
                initiationDescription:
                  type: string
                  maxLength: 512
                  description: Description of subscription initiation
    ConnectivityInsightsEventSubscriptionUpdated:
      description: event structure for event subscription updated
      allOf:
        - $ref: "#/components/schemas/ConnectivityInsightsSubscriptionLifecycleEvent"
        - type: object
          properties:
            data:
              description: Event detail structure for subscription updated event
              type: object
              required:
                - updateReason
                - subscriptionId
              properties:
                updateReason:
                  type: string
                  description: |
                    - SUBSCRIPTION_ACTIVE - API server transitioned subscription status to `ACTIVE`
                    - SUBSCRIPTION_INACTIVE - API server transitioned subscription status to `INACTIVE`
                  enum:
                    - SUBSCRIPTION_ACTIVE
                    - SUBSCRIPTION_INACTIVE
                subscriptionId:
                  $ref: "#/components/parameters/SubscriptionId/schema"
                updateDescription:
                  type: string
                  maxLength: 512
                  description: Description of subscription update
    ConnectivityInsightsEventSubscriptionEnded:
      description: event structure for event subscription ended
      allOf:
        - $ref: "#/components/schemas/ConnectivityInsightsSubscriptionLifecycleEvent"
        - type: object
          properties:
            data:
              description: Event detail structure for subscription ended event
              type: object
              required:
                - terminationReason
                - subscriptionId
              properties:
                terminationReason:
                  type: string
                  description: |
                    - NETWORK_TERMINATED - API server stopped sending notification
                    - SUBSCRIPTION_EXPIRED - Subscription expire time (optionally set by the requester) has been reached
                    - MAX_EVENTS_REACHED - Maximum number of events (optionally set by the requester) has been reached
                    - ACCESS_TOKEN_EXPIRED - Access Token sinkCredential (optionally set by the requester with credential type `ACCESSTOKEN`) expiration time has been reached
                    - SUBSCRIPTION_DELETED - Subscription was deleted by the requester
                  enum:
                    - MAX_EVENTS_REACHED
                    - NETWORK_TERMINATED
                    - SUBSCRIPTION_EXPIRED
                    - ACCESS_TOKEN_EXPIRED
                    - SUBSCRIPTION_DELETED
                subscriptionId:
                  $ref: "#/components/parameters/SubscriptionId/schema"
                terminationDescription:
                  type: string
                  maxLength: 512
                  description: Description of subscription termination
    ConnectivityInsightsApiEventType:
      type: string
      description: Event type for network quality notifications.
      enum:
        - org.camaraproject.connectivity-insights-subscriptions.v0.network-quality
    ConnectivityInsightsSubscriptionLifecycleEventType:
      type: string
      description: |
        Enum of subscription lifecycle event type strings.
        These are managed by Commonalities and are identical across all CAMARA
        APIs that support explicit subscriptions.
      enum:
        - org.camaraproject.connectivity-insights-subscriptions.v0.subscription-started
        - org.camaraproject.connectivity-insights-subscriptions.v0.subscription-updated
        - org.camaraproject.connectivity-insights-subscriptions.v0.subscription-ended
    QualityOnDemandAssignmentId:
      description: Identifier of the assignment record for the QoS profile assignment, that was created by the `createQosAssignment` operation
      type: string
      format: uuid
      maxLength: 36
    QualityOnDemandBaseAssignmentInfo:
      description: Common attributes of the assignment record for a QoS profile assignment
      type: object
      properties:
        device:
          description: |
            End-user equipment able to connect to a mobile network. Examples of devices include smartphones or IoT sensors/actuators.
                The developer can choose to provide the below specified device identifiers:
                * `ipv4Address`
                * `ipv6Address`
                * `phoneNumber`
                * `networkAccessIdentifier`
                NOTE1: the network operator might support only a subset of these options. The API Consumer can provide multiple identifiers to ensure compatibility across different network operators. In this case, the API Provider will use one of the identifiers for the API logic without performing any matching checks among the provided identifiers.
                NOTE2: as for this Commonalities release, we are enforcing that the networkAccessIdentifier is only part of the schema for future-proofing, and CAMARA does not currently allow its use. After the CAMARA meta-release work is concluded and the relevant issues are resolved, its use will need to be explicitly documented in the guidelines.
          type: object
          properties:
            phoneNumber:
              description: A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
              type: string
              pattern: ^\+[1-9][0-9]{4,14}$
              maxLength: 16
              example: "+123456789"
            networkAccessIdentifier:
              description: A public identifier addressing a subscription in a mobile network. In 3GPP terminology, it corresponds to the GPSI formatted with the External Identifier ({Local Identifier}@{Domain Identifier}). Unlike the telephone number, the network access identifier is not subjected to portability ruling in force, and is individually managed by each operator.
              type: string
              maxLength: 2048
              example: 123456789@example.com
            ipv4Address:
              type: object
              description: |
                The device should be identified by either the public (observed) IP address and port as seen by the application server, or the private (local) and any public (observed) IP addresses in use by the device (this information can be obtained by various means, for example from some DNS servers).

                If the allocated and observed IP addresses are the same (i.e. NAT is not in use) then  the same address should be specified for both publicAddress and privateAddress.

                If NAT64 is in use, the device should be identified by its publicAddress and publicPort, or separately by its allocated IPv6 address (field ipv6Address of the Device object)

                In all cases, publicAddress must be specified, along with at least one of either privateAddress or publicPort, dependent upon which is known. In general, mobile devices cannot be identified by their public IPv4 address alone.
              properties:
                publicAddress:
                  description: A single IPv4 address with no subnet mask
                  type: string
                  format: ipv4
                  maxLength: 15
                  example: 84.125.93.10
                privateAddress:
                  $ref: "#/components/schemas/BaseAssignmentInfo/properties/device/properties/ipv4Address/properties/publicAddress"
                publicPort:
                  description: TCP or UDP port number
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
              anyOf:
                - required:
                    - publicAddress
                    - privateAddress
                - required:
                    - publicAddress
                    - publicPort
              example:
                publicAddress: 84.125.93.10
                publicPort: 59765
            ipv6Address:
              description: |
                The device should be identified by the observed IPv6 address, or by any single IPv6 address from within the subnet allocated to the device (e.g. adding ::0 to the /64 prefix).
              allOf:
                - description: A single IPv6 address with no subnet mask
                  type: string
                  format: ipv6
                  maxLength: 45
                  example: 2001:db8:85a3:8d3:1319:8a2e:370:7344
          minProperties: 1
        qosProfile:
          $ref: "#/components/schemas/QualityOnDemandQosProfileName"
        sink:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https:\/\/.+$
          description: The address to which events shall be delivered using the selected protocol.
          example: https://endpoint.example.com/sink
        sinkCredential:
          description: A sink credential provides authentication or authorization information necessary to enable delivery of events to a target.
          type: object
          properties:
            credentialType:
              type: string
              enum:
                - ACCESSTOKEN
                - PRIVATE_KEY_JWT
              description: |
                The type of the credential - MUST be set to ACCESSTOKEN or PRIVATE_KEY_JWT for now
          discriminator:
            propertyName: credentialType
            mapping:
              ACCESSTOKEN: "#/components/schemas/AccessTokenCredential"
              PRIVATE_KEY_JWT: "#/components/schemas/PrivateKeyJWTCredential"
          required:
            - credentialType
      required:
        - qosProfile
    QualityOnDemandAssignmentInfo:
      description: |
        Information about a QoS profile assignment returned in responses.
        Optional device object only to be returned if provided in `createQosAssignment`. If more than one type of device identifier was provided, only one identifier will be returned (at implementation choice and with the original value provided in assignQosProfile).
        Please note that IP addresses of devices can change and get reused, so the original values may no longer identify the same device. They identified the device at the time the QoS profile assignment was created.
      allOf:
        - type: object
          properties:
            device:
              description: |
                An identifier for the end-user equipment able to connect to the network that the response refers to. This parameter is only returned when the API consumer includes the `device` parameter in their request (i.e. they are using a two-legged access token), and is relevant when more than one device identifier is specified, as only one of those device identifiers is allowed in the response.

                If the API consumer provides more than one device identifier in their request, and this schema is included in the response definition, the API provider MUST use it to return a single identifier which is the one they are using to fulfil the request, even if the identifiers do not match the same device. API provider does not perform any logic to validate/correlate that the indicated device identifiers match the same device. No error should be returned if the identifiers are otherwise valid to prevent API consumers correlating different identifiers with a given end user.
              allOf:
                - $ref: "#/components/schemas/BaseAssignmentInfo/properties/device"
                - maxProperties: 1
        - $ref: "#/components/schemas/QualityOnDemandBaseAssignmentInfo"
        - type: object
          properties:
            assignmentId:
              $ref: "#/components/schemas/QualityOnDemandAssignmentId"
            startedAt:
              description: Date and time when the QoS profile assignment became "AVAILABLE". Not to be returned when `status` is "REQUESTED". It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
              type: string
              format: date-time
              maxLength: 64
              example: "2024-06-01T12:00:00Z"
            status:
              $ref: "#/components/schemas/QualityOnDemandStatus"
            statusInfo:
              $ref: "#/components/schemas/QualityOnDemandStatusInfo"
          required:
            - assignmentId
            - status
    QualityOnDemandCreateAssignment:
      description: Attributes to request a new QoS profile assignment
      allOf:
        - type: object
          properties:
            device:
              $ref: "#/components/schemas/BaseAssignmentInfo/properties/device"
        - $ref: "#/components/schemas/QualityOnDemandBaseAssignmentInfo"
    QualityOnDemandRetrieveAssignmentByDevice:
      description: Attributes to look for a QoS profile assignment
      type: object
      properties:
        device:
          $ref: "#/components/schemas/BaseAssignmentInfo/properties/device"
    QualityOnDemandQosProfileName:
      description: |
        A unique name for identifying a specific QoS profile.
        This may follow different formats depending on the service providers implementation.
        Some options addresses:
          - A UUID style string
          - Support for predefined profiles QOS_S, QOS_M, QOS_L, and QOS_E
          - A searchable descriptive name
        The set of QoS Profiles that an API provider is offering may be retrieved by means of the QoS Profile API (qos-profile) or agreed on onboarding time.
      type: string
      example: QCI_1_voice
      minLength: 3
      maxLength: 256
      pattern: ^[a-zA-Z0-9_.-]+$
    QualityOnDemandQosProvisioningEventType:
      description: The type identifier for QoS provisioning status-change events.
      type: string
      enum:
        - org.camaraproject.qos-provisioning.v0.status-changed
    QualityOnDemandQosProvisioningNotificationEvent:
      description: Event compliant with the CloudEvents specification
      allOf:
        - type: object
          description: |
            CloudEvents 1.0 specification envelope.
            This schema is the stable base for all CAMARA event notifications.
            It imposes no constraints on `type` values or `data` structure —
            those concerns belong to the API-specific and lifecycle group schemas.
          required:
            - id
            - source
            - specversion
            - type
            - time
          properties:
            id:
              type: string
              maxLength: 256
              description: Identifier of this event, unique within the source context.
            source:
              type: string
              format: uri-reference
              minLength: 1
              maxLength: 2048
              description: |
                Identifies the context in which an event happened - be a non-empty `URI-reference` like:
                - URI with a DNS authority:
                  * https://github.com/cloudevents
                  * mailto:cncf-wg-serverless@lists.cncf.io
                - Universally-unique URN with a UUID:
                  * urn:uuid:6e8bc430-9c3a-11d9-9669-0800200c9a66
                - Application-specific identifier:
                  * /cloudevents/spec/pull/123
                  * 1-555-123-4567
              example: https://notificationSendServer12.example.com
            type:
              type: string
              maxLength: 512
              description: |
                Identifies the event type. CAMARA APIs use reverse-DNS notation:
                `org.camaraproject.<api-name>.<event-version>.<event-name>`
                The api-name segment makes each type globally unique across API groups.
            specversion:
              type: string
              description: Version of the specification to which this event conforms (must be 1.0 if it conforms to cloudevents 1.0.2 version)
              enum:
                - "1.0"
            datacontenttype:
              type: string
              description: media-type that describes the event payload encoding, must be "application/json" for CAMARA APIs
              enum:
                - application/json
            data:
              type: object
              description: Event details payload. Structure is defined by each concrete event schema.
            time:
              type: string
              format: date-time
              maxLength: 64
              description: Timestamp. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
              example: "2018-04-05T17:31:00Z"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/QualityOnDemandQosProvisioningEventType"
      discriminator:
        propertyName: type
        mapping:
          org.camaraproject.qos-provisioning.v0.status-changed: "#/components/schemas/QualityOnDemandEventStatusChanged"
    QualityOnDemandEventStatusChanged:
      description: Event to notify a QoS provisioning status change
      allOf:
        - $ref: "#/components/schemas/QualityOnDemandQosProvisioningNotificationEvent"
        - type: object
          properties:
            data:
              type: object
              description: Event details depending on the event type
              required:
                - assignmentId
                - status
              properties:
                assignmentId:
                  $ref: "#/components/schemas/QualityOnDemandAssignmentId"
                status:
                  $ref: "#/components/schemas/QualityOnDemandStatusChanged"
                statusInfo:
                  $ref: "#/components/schemas/QualityOnDemandStatusInfo"
          required:
            - data
    QualityOnDemandStatusInfo:
      description: |
        Reason for the new `status`:
        * `NETWORK_TERMINATED` - Network terminated the QoS profile assignment
        * `DELETE_REQUESTED` - User requested the deletion of the QoS profile assignment
      type: string
      enum:
        - NETWORK_TERMINATED
        - DELETE_REQUESTED
    QualityOnDemandStatus:
      description: |
        The current status of the requested QoS profile assignment. The status can be one of the following:
        * `REQUESTED` - QoS profile assignment has been requested but is still being processed.
        * `AVAILABLE` - The requested QoS profile has been assigned to the device, and is active.
        * `UNAVAILABLE` - The QoS profile assignment request has been processed but is not active. `statusInfo` may provide additional information about the reason for the unavailability.
      type: string
      enum:
        - REQUESTED
        - AVAILABLE
        - UNAVAILABLE
    QualityOnDemandStatusChanged:
      description: |
        The current status of a requested or previously available QoS profile assignment. Applicable values in the event are:
        *  `AVAILABLE` - The requested QoS profile has been assigned to the device, and is active.
        *  `UNAVAILABLE` - A requested or previously available QoS profile assignment is now unavailable. `statusInfo` may provide additional information about the reason for the unavailability.
      type: string
      enum:
        - AVAILABLE
        - UNAVAILABLE
