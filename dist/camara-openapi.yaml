    PopulationDensityDataRetrieveLocationBadRequest400:
      description: |-
        Problem with the client request. In addition to generic scenarios of `INVALID_ARGUMENT`, `INVALID_CREDENTIAL`, `INVALID_TOKEN`, `INVALID_SINK`, another scenarios may exist:
          - The area is not a polygon shape or exceeds supported complexity ("code": "POPULATION_DENSITY_DATA.INVALID_AREA", "message": "The area is not a polygon shape or exceeds supported complexity")
          - Indicated `startTime` is greater than the maximum allowed ("code": "POPULATION_DENSITY_DATA.MAX_STARTTIME_EXCEEDED", "message": "Indicated startTime is greater than the maximum allowed")
          - Indicated `startTime` is earlier than the minimum allowed ("code": "POPULATION_DENSITY_DATA.MIN_STARTTIME_EXCEEDED", "message": "Indicated startTime is earlier than the minimum allowed")
          - Indicated `endTime` is earlier than the `startTime` ("code": "POPULATION_DENSITY_DATA.INVALID_END_TIME", "message": "Indicated endTime is earlier than the startTime")
          - Indicated time period is partially in the past and partially in the future ("code": "POPULATION_DENSITY_DATA.INVALID_TIME_PERIOD", "message": "time period is partially in the past and partially in the future")
          - Indicated time period is greater than the maximum allowed (More than maximum hours between startTime and endTime) ("code": "POPULATION_DENSITY_DATA.MAX_TIME_PERIOD_EXCEEDED", "message": "Indicated time period is greater than the maximum allowed (More than maximum hours between startTime and endTime)")
      headers:
        x-correlator:
          description: Correlation id for the different services
          schema:
            $ref: "#/paths/~1retrieve/post/parameters/0/schema"
      content:
        application/json:
          schema:
            allOf:
              - type: object
                description: A structured error response providing details about a failed request, including the HTTP status code, an error code, and a human-readable message
                required:
                  - status
                  - code
                  - message
                properties:
                  status:
                    type: integer
                    format: int32
                    minimum: 100
                    maximum: 599
                    description: HTTP response status code
                  code:
                    type: string
                    maxLength: 96
                    description: A human-readable code to describe the error
                  message:
                    type: string
                    maxLength: 512
                    description: A human-readable description of what the event represents
              - type: object
                properties:
                  status:
                    enum:
                      - 400
                  code:
                    enum:
                      - INVALID_ARGUMENT
                      - INVALID_CREDENTIAL
                      - INVALID_TOKEN
                      - INVALID_SINK
                      - POPULATION_DENSITY_DATA.INVALID_AREA
                      - POPULATION_DENSITY_DATA.MAX_STARTTIME_EXCEEDED
                      - POPULATION_DENSITY_DATA.MIN_STARTTIME_EXCEEDED
                      - POPULATION_DENSITY_DATA.INVALID_END_TIME
                      - POPULATION_DENSITY_DATA.MAX_TIME_PERIOD_EXCEEDED
                      - POPULATION_DENSITY_DATA.INVALID_TIME_PERIOD
          examples:
            GENERIC_400_INVALID_ARGUMENT:
              description: Invalid Argument. Generic Syntax Exception
              value:
                status: 400
                code: INVALID_ARGUMENT
                message: Client specified an invalid argument, request body or query param.
            GENERIC_400_INVALID_CREDENTIAL:
              description: Invalid sink credential type
              value:
                status: 400
                code: INVALID_CREDENTIAL
                message: Only Access token or Private key JWT are supported
            GENERIC_400_INVALID_TOKEN:
              description: Invalid access token in the sink credential
              value:
                status: 400
                code: INVALID_TOKEN
                message: Access token in sink credential is invalid or expired
            GENERIC_400_INVALID_SINK:
              description: Invalid sink value
              value:
                status: 400
                code: INVALID_SINK
                message: sink not valid for the specified protocol
            POPULATION_DENSITY_DATA_400_INVALID_AREA:
              value:
                status: 400
                code: POPULATION_DENSITY_DATA.INVALID_AREA
                message: The area is not a polygon shape or has an arbitrary complexity
            POPULATION_DENSITY_DATA_400_MAX_STARTTIME_EXCEEDED:
              value:
                status: 400
                code: POPULATION_DENSITY_DATA.MAX_STARTTIME_EXCEEDED
                message: Indicated startTime is greater than the maximum allowed
            POPULATION_DENSITY_DATA_400_MIN_STARTTIME_EXCEEDED:
              value:
                status: 400
                code: POPULATION_DENSITY_DATA.MIN_STARTTIME_EXCEEDED
                message: Indicated startTime is earlier than the minimum allowed
            POPULATION_DENSITY_DATA_400_INVALID_END_TIME:
              value:
                status: 400
                code: POPULATION_DENSITY_DATA.INVALID_END_TIME
                message: Indicated endTime is earlier than the startTime
            POPULATION_DENSITY_DATA_400_MAX_TIME_PERIOD_EXCEEDED:
              value:
                status: 400
                code: POPULATION_DENSITY_DATA.MAX_TIME_PERIOD_EXCEEDED
                message: Indicated time period is greater than the maximum allowed (More than maximum hours between startTime and endTime)
            POPULATION_DENSITY_DATA_400_INVALID_TIME_PERIOD:
              value:
                status: 400
                code: POPULATION_DENSITY_DATA.INVALID_TIME_PERIOD
                message: Indicated time period is partially in the past and partially in the future
    PopulationDensityDataRetrieveLocationUnprocessableContent422:
      description: |-
        Problem with the client request. The following scenarios may exist:
          - Indicated combination of area, time interval and precision is too big for both synchronous and asynchronous processing, so providing `sink` does not help ("code": "POPULATION_DENSITY_DATA.UNSUPPORTED_REQUEST", "message": "Indicated combination of area, time interval and precision is too big for both synchronous and asynchronous processing")
          - Indicated cell precision (Geohash level) is not supported ("code": "POPULATION_DENSITY_DATA.UNSUPPORTED_PRECISION", "message": "Indicated cell precision (Geohash level) is not supported")
          - Indicated combination of area, time interval and precision is too big for a sync response and asynchronous processing is not enabled ("code": "POPULATION_DENSITY_DATA.UNSUPPORTED_SYNC_RESPONSE", "message": "Indicated combination of area, time interval and precision is too big for synchronous processing and asynchronous processing is not enabled")
          - `sink` is provided but the API provider does not support asynchronous processing at all, whatever the size of the request ("code": "POPULATION_DENSITY_DATA.UNSUPPORTED_ASYNC_RESPONSE", "message": "The API provider does not support the asynchronous processing")
          - The requested `areaType` is not supported by the MNO ("code": "POPULATION_DENSITY_DATA.UNSUPPORTED_AREA_TYPE", "message": "The requested areaType is not supported by the MNO")
          - `sinkCredential.credentialType` is set to `PRIVATE_KEY_JWT` but no JWK Set is configured for the API consumer ("code": "PRIVATE_KEY_JWT_NOT_CONFIGURED", "message": "No JWK Set configured for PRIVATE_KEY_JWT authentication.")
      headers:
        x-correlator:
          $ref: "#/components/responses/RetrieveLocationBadRequest400/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/responses/RetrieveLocationBadRequest400/content/application~1json/schema/allOf/0"
              - type: object
                properties:
                  status:
                    enum:
                      - 422
                  code:
                    enum:
                      - POPULATION_DENSITY_DATA.UNSUPPORTED_REQUEST
                      - POPULATION_DENSITY_DATA.UNSUPPORTED_PRECISION
                      - POPULATION_DENSITY_DATA.UNSUPPORTED_SYNC_RESPONSE
                      - POPULATION_DENSITY_DATA.UNSUPPORTED_AREA_TYPE
                      - POPULATION_DENSITY_DATA.UNSUPPORTED_ASYNC_RESPONSE
                      - PRIVATE_KEY_JWT_NOT_CONFIGURED
          examples:
            POPULATION_DENSITY_DATA_422_UNSUPPORTED_REQUEST:
              description: The request is too big to be processed even asynchronously, so retrying it with sink does not help. Only a smaller request does
              value:
                status: 422
                code: POPULATION_DENSITY_DATA.UNSUPPORTED_REQUEST
                message: Indicated combination of area, time interval and precision is too big for both synchronous and asynchronous processing
            POPULATION_DENSITY_DATA_422_UNSUPPORTED_PRECISION:
              value:
                status: 422
                code: POPULATION_DENSITY_DATA.UNSUPPORTED_PRECISION
                message: Indicated cell precision (Geohash level) is not supported
            POPULATION_DENSITY_DATA_422_UNSUPPORTED_SYNC_RESPONSE:
              value:
                status: 422
                code: POPULATION_DENSITY_DATA.UNSUPPORTED_SYNC_RESPONSE
                message: Indicated combination of area, time interval and precision is too big for synchronous processing and asynchronous processing is not enabled
            POPULATION_DENSITY_DATA_422_UNSUPPORTED_AREA_TYPE:
              value:
                status: 422
                code: POPULATION_DENSITY_DATA.UNSUPPORTED_AREA_TYPE
                message: The requested areaType is not supported by the MNO
            POPULATION_DENSITY_DATA_422_UNSUPPORTED_ASYNC_RESPONSE:
              description: The API consumer requested the asynchronous behaviour by providing sink, but the API provider does not support asynchronous processing. Unlike UNSUPPORTED_REQUEST, this error does not depend on the size of the request
              value:
                status: 422
                code: POPULATION_DENSITY_DATA.UNSUPPORTED_ASYNC_RESPONSE
                message: The API provider does not support the asynchronous processing
            GENERIC_422_PRIVATE_KEY_JWT_NOT_CONFIGURED:
              description: Private key JWT sink credential type is used but no configuration was pre-shared
              value:
                status: 422
                code: PRIVATE_KEY_JWT_NOT_CONFIGURED
                message: No JWK Set configured for PRIVATE_KEY_JWT authentication.
