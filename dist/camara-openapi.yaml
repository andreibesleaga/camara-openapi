  /knowyourcustomermatch/match:
    post:
      tags:
        - KnowYourCustomerMatch
      summary: Matching a customer identity by checking a set of attributes related against the account data bound to their phone number.
      description: |-
        Verify matching of a number of attributes related to a customer identity against the verified data bound to their phone number in the Operator systems. Regardless of whether the `phoneNumber` is explicitly stated in the request body, at least one of the other fields must be provided, otherwise a `HTTP 400 - KNOW_YOUR_CUSTOMER.INVALID_PARAM_COMBINATION` error will be returned.

        The API will return the result of the matching process for each requested attribute. This means that the response will **only** contain the attributes for which validation has been requested. Possible values are:k          - **true**: the attribute provided matches with the one in the Operator systems, which is equal to a `match_score` of 100.
          - **false**: the attribute provided does not match with the one in the Operator systems.
          - **not_available**: the attribute is not available to validate.
      operationId: KnowYourCustomerMatch_kycMatch
      security:
        - openId:
            - kyc-match:match
      parameters:
        - name: x-correlator
          in: header
          description: Correlation id for the different services
          schema:
            type: string
            description: Correlator string, UUID format recommended but any string matching the pattern can be used
            pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
            maxLength: 256
            example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowYourCustomerMatchKycMatchRequestBody"
            examples:
              Two-Legged and Three-leg Access Token Example:
                value:
                  phoneNumber: "+34629255833"
                  idDocument: 66666666q
                  idDocumentType: passport
                  idDocumentExpiryDate: "2027-07-12"
                  bankAccountNumber: IBAN:NL59ABNA0123456789
                  name: Federica Sanchez Arjona
                  givenName: Federica
                  familyName: Sanchez Arjona
                  nameKanaHankaku: federica
                  nameKanaZenkaku: Ｆｅｄｅｒｉｃａ
                  middleNames: Sanchez
                  familyNameAtBirth: YYYY
